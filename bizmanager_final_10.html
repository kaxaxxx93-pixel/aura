index.html<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#7C6FE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BizManager">
<title>BizManager Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== DESIGN TOKENS ===== */
:root{
  --pu:#5B8DEF;--pu2:#2D5BE3;--pu3:#EBF0FF;--pu4:#1A3A8F;
  --gr:#22C55E;--gr2:#15803D;--gr3:#DCFCE7;
  --re:#EF4444;--re2:#B91C1C;--re3:#FEE2E2;
  --ye:#F59E0B;--ye2:#B45309;--ye3:#FEF3C7;
  --bl:#06B6D4;--bl2:#0E7490;--bl3:#CFFAFE;
  --bg:#F1F5F9;--card:#FFFFFF;
  --tx:#1E293B;--tx2:#64748B;--tx3:#94A3B8;--br:#E2E8F0;
  --sb:#0F172A;--sb2:#1E293B;--sb3:#334155;--sb-txt:rgba(255,255,255,.85);--sb-dim:rgba(255,255,255,.45);
  --radius:16px;--shadow:0 2px 16px rgba(0,0,0,.07);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-size:14px}

/* ===== SCREENS ===== */
.screen{display:none;height:100vh;width:100%}
.screen.active{display:flex}
#s-orgs,#s-neworg,#s-login{flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--sb) 0%,var(--pu2) 100%);padding:20px}

/* ===== SIDEBAR LAYOUT ===== */
#s-app{flex-direction:row!important;overflow:hidden}
.sidebar{width:220px;min-height:100vh;background:var(--sb);display:flex;flex-direction:column;flex-shrink:0;z-index:10}
.sb-logo{display:flex;align-items:center;gap:10px;padding:20px 16px 16px}
.sb-logo-icon{width:36px;height:36px;border-radius:10px;background:var(--pu2);color:#fff;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center}
.sb-logo-text{font-size:15px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-nav{flex:1;padding:8px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.sb-bottom{padding:10px}
.sb-user-card{display:flex;align-items:center;gap:8px;background:var(--sb2);border-radius:12px;padding:10px 12px}
.sb-avatar{width:34px;height:34px;border-radius:50%;background:var(--pu2);color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-user-info{flex:1;min-width:0}
.sb-user-name{font-size:12px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user-role{font-size:10px;color:var(--sb-dim);font-weight:700;margin-top:1px}
.sb-logout{background:none;border:none;color:var(--sb-dim);cursor:pointer;padding:4px;border-radius:6px;display:flex;align-items:center}
.sb-logout:hover{color:#fff;background:var(--sb3)}

/* Sidebar nav buttons */
.bni{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:none;background:transparent;color:var(--sb-dim);cursor:pointer;width:100%;font-family:inherit;font-size:13px;font-weight:700;transition:all .15s;text-align:left}
.bni:hover{background:var(--sb2);color:#fff}
.bni.on{background:var(--pu2);color:#fff!important;font-weight:900}
.bni-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bni-label{flex:1}
.bni-dots{font-size:16px;letter-spacing:2px;color:var(--sb-dim)}

/* ===== MAIN CONTENT ===== */
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.main-topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--br);flex-shrink:0}
.mt-title{font-size:17px;font-weight:900;color:var(--tx)}
.mt-right{display:flex;align-items:center;gap:8px}
.pages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column}
.pg{display:none;flex-direction:column;flex:1;min-height:0}
.pg.on{display:flex}
.wrap{display:flex;flex-direction:column;gap:12px;width:100%;max-width:960px;margin:0 auto}

/* ===== CARDS ===== */
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.ct{font-size:14px;font-weight:900;color:var(--tx);margin-bottom:10px}

/* ===== METRIC STRIP ===== */
.mstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mc{border-radius:14px;padding:14px;cursor:default}
.mc.gr{background:var(--gr3)}.mc.pu{background:var(--pu3)}.mc.re{background:var(--re3)}.mc.ye{background:var(--ye3)}.mc.bl{background:var(--bl3)}
.ml{font-size:11px;font-weight:800;color:var(--tx2);margin-bottom:4px}
.mv{font-size:20px;font-weight:900;color:var(--tx)}
.mc.gr .mv{color:var(--gr2)}.mc.pu .mv{color:var(--pu2)}.mc.re .mv{color:var(--re2)}.mc.ye .mv{color:var(--ye2)}.mc.bl .mv{color:var(--bl2)}
.ms{font-size:11px;font-weight:700;color:var(--tx3);margin-top:2px}

/* ===== FORMS ===== */
.inp{width:100%;border:1.5px solid var(--br);border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit;background:var(--card);color:var(--tx);outline:none;transition:border .15s}
.inp:focus{border-color:var(--pu)}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.row label{font-size:12px;font-weight:800;color:var(--tx2);min-width:100px;flex-shrink:0}
.u{font-size:12px;color:var(--tx3);font-weight:700;flex-shrink:0}

/* ===== BUTTONS ===== */
.btn{border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;background:var(--bg);color:var(--tx);transition:opacity .15s}
.btn:active{opacity:.8}
.btn-pu{background:var(--pu2);color:#fff}
.btn-gr{background:var(--gr);color:#fff}
.btn-re{background:var(--re);color:#fff}
.btn-ye{background:var(--ye);color:#fff}
.btn-bl{background:var(--bl);color:#fff}
.del{background:var(--re3);border:none;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:800;color:var(--re);cursor:pointer}

/* ===== LIST ITEMS ===== */
.li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--br)}
.li:last-child{border-bottom:none}
.rw{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--br)}
.rw:last-child{border-bottom:none}
.sl{font-size:13px;font-weight:700;color:var(--tx2)}.sr{font-size:13px;font-weight:900}
.srow{display:flex;justify-content:space-between;padding:4px 0}
.trow{display:flex;justify-content:space-between;padding:10px 0;border-top:2px solid var(--br);font-weight:900;font-size:14px;margin-top:4px}

/* ===== BADGES ===== */
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:800}
.bdg-gr{background:var(--gr3);color:var(--gr2)}.bdg-re{background:var(--re3);color:var(--re2)}
.bdg-ye{background:var(--ye3);color:var(--ye2)}.bdg-bl{background:var(--bl3);color:var(--bl2)}
.bdg-pu{background:var(--pu3);color:var(--pu2)}
.bdg-cash{background:#DCFCE7;color:#15803D}.bdg-card{background:#DBEAFE;color:#1D4ED8}
.bdg-click{background:#EDE9FE;color:#6D28D9}.bdg-plastic{background:#FCE7F3;color:#9D174D}
.bdg-transfer{background:#FEF3C7;color:#92400E}

/* ===== PROGRESS ===== */
.prog{background:var(--bg);border-radius:6px;height:6px;overflow:hidden}
.pf{height:100%;border-radius:6px;background:var(--pu2)}

/* ===== PAY OPTS ===== */
.pay-opts{display:flex;flex-wrap:wrap;gap:6px}
.pay-opt{border:1.5px solid var(--br);border-radius:10px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer;background:var(--card);color:var(--tx2);font-family:inherit}
.pay-opt:hover{border-color:var(--pu);color:var(--pu)}
.sel-cash{background:var(--gr3);border-color:var(--gr);color:var(--gr2)}
.sel-card{background:var(--bl3);border-color:var(--bl);color:var(--bl2)}
.sel-click{background:var(--pu3);border-color:var(--pu);color:var(--pu2)}
.sel-plastic{background:var(--re3);border-color:var(--re);color:var(--re2)}
.sel-transfer{background:var(--ye3);border-color:var(--ye);color:var(--ye2)}

/* ===== SOPT (seller picker) ===== */
.sopt{display:flex;flex-wrap:wrap;gap:6px}
.sopt-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1.5px solid var(--br);border-radius:10px;background:var(--card);cursor:pointer;font-size:12px;font-weight:700;color:var(--tx2);font-family:inherit}
.sopt-btn.on{background:var(--pu3);border-color:var(--pu2);color:var(--pu2)}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0}

/* ===== GRID HELPERS ===== */
.g2c{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.g2c{grid-template-columns:1fr}}

/* ===== PHOTO BOX ===== */
.ph-box{width:64px;height:64px;border-radius:12px;background:var(--bg);border:2px dashed var(--br);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;overflow:hidden;background-size:cover;background-position:center}

/* ===== TASK CARD ===== */
.task-card{display:flex;align-items:flex-start;gap:12px;background:var(--bg);border-radius:14px;padding:12px}
.task-check{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--br);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-top:1px}
.task-check.done{background:var(--gr);border-color:var(--gr)}

/* ===== ANN CARD ===== */
.ann-card{background:linear-gradient(135deg,var(--pu2),var(--pu));border-radius:16px;padding:14px;color:#fff}

/* ===== RECEIPT ===== */
.rcpt-wrap{background:#fff;border-radius:20px;padding:20px;border:2px solid var(--gr);max-width:360px;margin:0 auto}
.rcpt-inner{font-family:'Courier New',monospace}

/* ===== EMPTY STATE ===== */
.empty{text-align:center;padding:32px 20px;color:var(--tx3);font-size:13px;font-weight:700;line-height:1.6}

/* ===== SIDE NAV (in sub-pages) ===== */
.side-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;padding:10px;background:var(--card);border-radius:14px;box-shadow:var(--shadow)}
.side-nav-btn{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:10px;border:none;font-size:12px;font-weight:800;cursor:pointer;background:var(--bg);color:var(--tx2);font-family:inherit}
.side-nav-btn.active{background:var(--pu2);color:#fff}
.side-nav-btn:hover:not(.active){background:var(--pu3);color:var(--pu2)}

/* ===== AUTH SCREENS ===== */
.auth-bg{
  min-height:100vh;width:100%;
  background:linear-gradient(160deg,var(--sb) 0%,var(--sb2) 50%,var(--pu2) 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px;overflow-y:auto;
}
.auth-logo-wrap{display:flex;align-items:center;gap:14px;margin-bottom:28px;max-width:420px;width:100%}
.auth-logo-icon{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;backdrop-filter:blur(10px)}
.auth-logo-name{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.3px}
.auth-logo-sub{font-size:13px;color:rgba(255,255,255,.6);font-weight:600;margin-top:2px}
.auth-card{
  background:#fff;border-radius:24px;padding:28px 24px;
  max-width:420px;width:100%;
  box-shadow:0 24px 64px rgba(0,0,0,.35);
}
.auth-card-title{font-size:20px;font-weight:900;color:var(--tx);margin-bottom:4px}
.auth-card-sub{font-size:13px;color:var(--tx2);font-weight:600;margin-bottom:20px}
.auth-field{margin-bottom:14px}
.auth-label{display:block;font-size:12px;font-weight:800;color:var(--tx2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.auth-input{width:100%;padding:12px 14px;border:2px solid var(--br);border-radius:12px;font-size:14px;font-weight:700;font-family:inherit;color:var(--tx);background:#fff;outline:none;transition:border .15s}
.auth-input:focus{border-color:var(--pu)}
.auth-btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,var(--pu2),var(--pu));color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:900;cursor:pointer;margin-bottom:10px;font-family:inherit;box-shadow:0 4px 16px rgba(91,141,239,.35)}
.auth-btn-outline{width:100%;padding:13px;background:transparent;color:var(--pu);border:2px solid var(--pu);border-radius:14px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
.auth-btn-outline:hover{background:var(--pu3)}
.auth-btn-ghost{width:100%;padding:11px;background:transparent;color:var(--tx3);border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px}
.auth-btn-ghost:hover{background:var(--bg)}
/* Role tabs */
.auth-role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.auth-role-tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px;border:2px solid var(--br);border-radius:16px;background:#fff;cursor:pointer;font-family:inherit;transition:all .15s}
.auth-role-tab.active{border-color:var(--pu);background:var(--pu3)}
.auth-role-icon{font-size:26px}
.auth-role-name{font-size:13px;font-weight:900;color:var(--tx)}
.auth-role-desc{font-size:11px;color:var(--tx3);font-weight:600}
.auth-role-tab.active .auth-role-name{color:var(--pu2)}
/* PIN */
.auth-pin-label{font-size:13px;font-weight:700;color:var(--tx2);text-align:center;margin-bottom:14px}
.auth-pin-dots{display:flex;gap:14px;justify-content:center;margin-bottom:14px}
.auth-pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--br);background:#fff;transition:all .15s}
.auth-pin-dot.filled{background:var(--pu);border-color:var(--pu);transform:scale(1.15)}
.auth-pin-error{min-height:20px;text-align:center;font-size:13px;font-weight:700;color:var(--re);margin-bottom:10px}
/* Numpad */
.auth-numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.auth-nk{padding:16px;border:2px solid var(--br);border-radius:14px;background:#fff;font-size:22px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--tx);transition:all .1s}
.auth-nk:active{transform:scale(.94);background:var(--bg)}
.auth-nk-ghost{background:var(--bg);color:var(--tx2);font-size:18px}
.auth-nk-primary{background:linear-gradient(135deg,var(--pu2),var(--pu));color:#fff;border-color:var(--pu);font-size:20px;box-shadow:0 4px 12px rgba(91,141,239,.3)}
/* Org cards */
.org-card{display:flex;align-items:center;gap:14px;padding:14px;border:2px solid var(--br);border-radius:16px;cursor:pointer;margin-bottom:10px;background:#fff;transition:all .15s}
.org-card:hover{border-color:var(--pu);background:var(--pu3)}
.org-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--pu2),var(--pu));color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;flex-shrink:0}
.org-name{font-size:15px;font-weight:900;color:var(--tx)}
.org-sub{font-size:12px;color:var(--tx2);font-weight:600;margin-top:2px}
.org-arr{margin-left:auto;color:var(--tx3)}

/* ===== MODULE GRID ===== */
.mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mod-card{border-radius:18px;padding:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-end}
.mod-card.pu{background:var(--pu2)}.mod-card.re{background:var(--re)}.mod-card.ye{background:var(--ye)}.mod-card.gr{background:var(--gr)}.mod-card.bl{background:var(--bl)}
.mod-icon{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.mod-name{font-size:14px;font-weight:900;color:#fff}.mod-sub{font-size:11px;color:rgba(255,255,255,.75);font-weight:700;margin-top:2px}
.mod-arr{opacity:.7}

/* ===== STOCK LIST ===== */
.stock-list{display:flex;flex-direction:column;gap:3px}
.stock-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid var(--br)}

/* ===== MISC ===== */
.g2c{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:680px){
  .sidebar{width:64px}.sb-logo-text,.bni-label,.sb-user-info{display:none}
  .sb-logo{justify-content:center;padding:16px 0}.sb-logo-icon{margin:0}
  .bni{justify-content:center;padding:10px}.sb-user-card{padding:8px;justify-content:center}
  .sb-avatar{margin:0}.sb-logout{display:none}
  .main-content{min-width:0}.pages{padding:12px}
}
@media print{.sidebar,.main-topbar,.btn,.del,.no-print{display:none!important}.pages{padding:0}.pg.on{display:block}}

/* ===== ORG SCREENS ===== */
.orgs-top{text-align:center;margin-bottom:24px}.logo{font-size:28px;font-weight:900;color:#fff}.logo-sub{font-size:14px;color:rgba(255,255,255,.6);margin-top:4px;font-weight:700}
.orgs-card{background:#fff;border-radius:24px;padding:24px;max-width:400px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.orgs-title{font-size:16px;font-weight:900;color:var(--tx);margin-bottom:14px}
.btn-add-org{width:100%;margin-top:12px;padding:12px;background:transparent;border:2px dashed var(--br);border-radius:12px;color:var(--tx3);font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-add-org:hover{border-color:var(--pu2);color:var(--pu2)}

/* ===== NEW ORG SCREEN ===== */
.neworg-card{background:#fff;border-radius:24px;padding:24px;max-width:400px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.neworg-title{font-size:18px;font-weight:900;color:var(--tx);margin-bottom:16px}

/* ===== LOGIN SCREEN ===== */
.login-top{text-align:center;margin-bottom:20px}
.login-org{font-size:22px;font-weight:900;color:#fff;margin-bottom:4px}
.login-hint{font-size:13px;color:rgba(255,255,255,.6);font-weight:700}
.login-card{background:#fff;border-radius:24px;padding:24px;max-width:380px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.login-wrap{background:#fff;border-radius:24px;padding:24px;max-width:380px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.role-tabs{display:flex;gap:8px;margin-bottom:16px}
.role-tab{flex:1;border:2px solid var(--br);border-radius:14px;padding:12px;text-align:center;cursor:pointer;transition:all .15s}
.role-tab.on{border-color:var(--pu2);background:var(--pu3)}
.ri{font-size:22px;margin-bottom:4px}.rn{font-size:13px;font-weight:900;color:var(--tx)}.rd{font-size:10px;color:var(--tx3);font-weight:700;margin-top:2px}
.pin-display{text-align:center;margin-bottom:12px}
.pin-label{font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:8px}
.step1,.step2,.step3{display:none}.step1.active,.step2.active,.step3.active{display:block}

/* ===== NUMPAD & PIN ===== */
.nk{background:var(--bg);border:none;border-radius:14px;padding:16px;font-size:22px;font-weight:900;cursor:pointer;font-family:inherit;color:var(--tx);transition:all .15s}
.nk:active{background:var(--pu2);color:#fff;transform:scale(.95)}
.pin-row{display:flex;gap:10px;justify-content:center;margin:14px 0}
.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--br);transition:background .2s}
.pin-dot.filled{background:var(--pu2)}
.pin-err{color:var(--re);font-size:12px;font-weight:700;text-align:center;min-height:18px;margin-top:6px}
.pin-label{font-size:13px;font-weight:800;color:var(--tx2);text-align:center;margin-top:8px}
.emp-sel{width:100%;border:1.5px solid var(--br);border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;background:var(--card);color:var(--tx);margin-bottom:10px;outline:none}

/* ===== ORG CARD ===== */
.org-card{background:#fff;border-radius:18px;padding:16px 20px;margin-bottom:8px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.org-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.15)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>



























































































// ===== DATA =====
const SK = 'biz_final_v1';
const PL = {cash:'Наличные',card:'Карта',click:'Click',plastic:'Payme',transfer:'Перевод'};
const PBG = {cash:'#EAF3DE',card:'#E6F1FB',click:'#EEEDFE',plastic:'#FBEAF0',transfer:'#FAEEDA'};
const PC = {cash:'#27500A',card:'#042C53',click:'#3C3489',plastic:'#72243E',transfer:'#854F0B'};
const EC = ['#B5D4F4','#9FE1CB','#FAC775','#F4C0D1','#CECBF6','#F5C4B3','#FDDCB8','#C3EAD5'];
const ET = ['#0C447C','#085041','#633806','#72243E','#3C3489','#712B13','#7A4210','#0A4730'];

let DB = {orgs:[]};
let curOrg = null, curRole = null, curEmpId = null;
let loginRole = 'dir', curPin = '';
let curPay = 'cash', curSeller = null, tmpBI = [], CH = {};

// ===== STORAGE =====
function load() { try { const s=localStorage.getItem(SK); if(s) DB=JSON.parse(s); } catch(e){} }
function save() { try { localStorage.setItem(SK,JSON.stringify(DB)); } catch(e){} }
function od() { if(!DB[curOrg]) DB[curOrg]=emptyOrg(); return DB[curOrg]; }
function sd(d) { DB[curOrg]=d; save(); }
function emptyOrg() {
  return {
    products:[], sales:[], employees:[], salaries:[], cashbook:[],
    withdrawals:[], defects:[], debts:[], tasks:[], taskTmpls:[],
    announcements:[], bfLog:[], bonusRequests:[], clients:[], investments:[], investMode:'pre',
    cfg:{shop:'Мой магазин',tax:4,pen:412000,soc:0,card:0.9,click:1,
         plastic:0.8,transfer:0,rent:0,util:0,ads:0,min:3,dirPin:'1234',mgrPin:'0000'}
  };
}

// ===== HELPERS =====
const fm = n => (Math.round(n)||0).toLocaleString('ru-RU')+' сум';
const pc = (a,b) => b>0 ? ((a/b)*100).toFixed(1)+'%' : '0%';
const td = () => new Date().toISOString().slice(0,10);
const ini = n => (n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const gid = () => Date.now()*1000+Math.floor(Math.random()*999);
const bar = (v,t,c) => { const w=t>0?Math.min(v/t*100,100):0; return `<div class="prog"><div class="pf" style="width:${w}%;background:${c}"></div></div>`; };
function dc(id) { if(CH[id]){CH[id].destroy();delete CH[id];} }
function commRate(pay) { const c=od().cfg; return{card:c.card,click:c.click,plastic:c.plastic,transfer:c.transfer}[pay]||0; }
function cashBal() {
  const d=od();
  const fs=d.sales.filter(s=>s.pay==='cash').reduce((a,s)=>a+s.total,0);
  const mi=d.cashbook.filter(c=>c.type==='in').reduce((a,c)=>a+c.amt,0);
  const mo=d.cashbook.filter(c=>c.type==='out').reduce((a,c)=>a+c.amt,0);
  const wd=d.withdrawals.reduce((a,w)=>a+w.amt,0);
  var bal=fs+mi-mo-wd;
  return {fs:fs,mi:mi,mo:mo,wd:wd,bal:bal};
}

// ===== SCREEN NAVIGATION =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  var sc=document.getElementById(id);if(sc)sc.classList.add('active');
}

// ===== ORG LIST =====
function renderOrgList() {
  var colors=['#5B8DEF','#22C55E','#F59E0B','#EF4444','#06B6D4','#8B5CF6'];
  var el=document.getElementById('org-list');
  if(!el)return;
  if(!DB.orgs.length){
    el.innerHTML='<div style="text-align:center;padding:20px 0;color:rgba(0,0,0,.4);font-size:13px;font-weight:700">Нет организаций. Добавьте первую!</div>';
    return;
  }
  el.innerHTML=DB.orgs.map(function(o,i){
    var cnt=(DB[o.id]&&DB[o.id].sales||[]).length;
    var salesSum=(DB[o.id]&&DB[o.id].sales||[]).reduce(function(a,s){return a+s.total;},0);
    return'<div class="org-card" data-oid="'+o.id+'" onclick="goToLogin(this.dataset.oid)">'
      +'<div class="org-icon" style="background:linear-gradient(135deg,'+colors[i%6]+'cc,'+colors[i%6]+')">'+o.name.charAt(0).toUpperCase()+'</div>'
      +'<div style="flex:1;min-width:0"><div class="org-name">'+o.name+'</div>'
      +'<div class="org-sub">'+cnt+' продаж · '+salesSum.toLocaleString('ru-RU')+' сум</div></div>'
      +'<svg class="org-arr" width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M1 1l6 6-6 6" stroke="var(--tx3)" stroke-width="2" stroke-linecap="round"/></svg>'
      +'</div>';
  }).join('');
}


function createOrg() {
  const name = (document.getElementById('no-name').value||'').trim();
  const pin  = (document.getElementById('no-pin').value||'').replace(/\D/g,'');
  const mpin = (document.getElementById('no-mpin').value||'').replace(/\D/g,'');
  if(!name) return alert('Введите название организации');
  if(pin.length !== 4) return alert('PIN директора должен быть 4 цифры (только цифры)');
  if(mpin.length !== 4) return alert('PIN менеджера должен быть 4 цифры (только цифры)');
  const id = 'org_' + gid();
  DB.orgs.push({id, name});
  const d = emptyOrg();
  d.cfg.shop = name;
  d.cfg.dirPin = pin;
  d.cfg.mgrPin = mpin;
  DB[id] = d;
  save();
  // Auto-login as director
  curOrg = id;
  curRole = 'dir';
  curEmpId = null;
  document.getElementById('no-name').value = '';
  document.getElementById('no-pin').value = '';
  document.getElementById('no-mpin').value = '';
  renderOrgList();
  startApp();
}

// ===== LOGIN =====
function goToLogin(orgId) {
  curOrg = orgId;
  const org = DB.orgs.find(o=>o.id===orgId);
  document.getElementById('login-orgname').textContent = org?.name || '';
  loginRole = 'dir';
  curPin = '';
  var rd=document.getElementById('rt-dir'),rm=document.getElementById('rt-mgr');
  if(rd)rd.classList.add('on');if(rm)rm.classList.remove('on');
  document.getElementById('emp-wrap').style.display = 'none';
  document.getElementById('pin-label').textContent = 'PIN директора';
  renderPinDots();
  document.getElementById('pin-err').textContent = '';
  showScreen('s-login');
}

function selRole(r) {
  loginRole = r;
  curPin = '';
  var rrd=document.getElementById('rt-dir'),rrm=document.getElementById('rt-mgr');
  if(rrd){rrd.classList.toggle('on',r==='dir');rrd.classList.toggle('active',r==='dir');}
  if(rrm){rrm.classList.toggle('on',r==='mgr');rrm.classList.toggle('active',r==='mgr');}
  const ew = document.getElementById('emp-wrap');
  if(r==='mgr') {
    const d = od();
    ew.style.display = 'block';
    document.getElementById('emp-sel').innerHTML =
      '<option value="">— Выберите сотрудника —</option>' +
      d.employees.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
    document.getElementById('pin-label').textContent = 'PIN менеджера';
  } else {
    ew.style.display = 'none';
    document.getElementById('pin-label').textContent = 'PIN директора';
  }
  renderPinDots();
  document.getElementById('pin-err').textContent = '';
}

function pk(n) {
  if(n === 'back') { curPin = curPin.slice(0,-1); renderPinDots(); return; }
  if(curPin.length >= 4) return;
  curPin += n;
  renderPinDots();
  if(curPin.length === 4) setTimeout(doLogin, 80);
}
function pdel() { curPin = curPin.slice(0,-1); renderPinDots(); }
function renderPinDots() {
  document.querySelectorAll('.auth-pin-dot,.pin-dot').forEach(function(d,i){d.classList.toggle('filled',i<curPin.length);d.classList.toggle('on',i<curPin.length);});
}
function doLogin() {
  const d = od(); const cfg = d.cfg;
  if(loginRole === 'dir') {
    if(curPin !== cfg.dirPin) { document.getElementById('pin-err').textContent='Неверный PIN'; curPin=''; renderPinDots(); return; }
    curRole='dir'; curEmpId=null;
  } else {
    const eid = parseInt(document.getElementById('emp-sel').value);
    if(!eid) { document.getElementById('pin-err').textContent='Выберите сотрудника'; curPin=''; renderPinDots(); return; }
    const empForPin=d.employees.find(function(e){return e.id===eid;});
    const correctPin=empForPin&&empForPin.pin?empForPin.pin:cfg.mgrPin;
    if(curPin!==correctPin){document.getElementById('pin-err').textContent='Неверный PIN';curPin='';renderPinDots();return;}
    curRole='mgr';curEmpId=eid;
  }
  startApp();
}
function doLogout() {
  showScreen('s-login');
  curPin=''; renderPinDots();
  document.getElementById('pin-err').textContent='';
  loginRole='dir'; selRole('dir');
}

// ===== APP SHELL =====
const TABS_DIR = ['home','sale','sellers','finance','more'];
const TABS_MGR = ['home','sale','tasks'];
const PAGES_DIR = ['home','sale','sellers','finance','clients','invest','plan','cash','daily','stock','salary','taxes','defects','tasks','analytics','abc','debts','breakeven','report','settings','more'];
const PAGES_MGR = ['home','sale','tasks'];
const TAB_NAMES = {home:'Главная',sale:'Продажа',sellers:'Продавцы',finance:'Финансы',more:'Ещё',cash:'Касса',stock:'Склад',tasks:'Задачи',mystat:'Статистика'};

function startApp() {
  const org = DB.orgs.find(o=>o.id===curOrg);
  document.getElementById('top-orgname').textContent = org?.name || '';
  const rp = document.getElementById('top-role');
  rp.textContent = curRole==='dir'?'Директор':'Менеджер';
  rp.className = 'top-role '+(curRole==='dir'?'dir':'mgr');
  const emp = od().employees.find(e=>e.id===curEmpId);
  document.getElementById('top-user').textContent = emp?.name||'';
  buildApp();
  autoTasks();
  showScreen('s-app');
  goPage('home');
}

function buildApp() {
  const navTabs = curRole==='dir'?TABS_DIR:TABS_MGR;
  const allPages = curRole==='dir'?PAGES_DIR:PAGES_MGR;
  // Set sidebar org name
  var org=DB.orgs.find(function(o){return o.id===curOrg;});
  var sbOrg=document.getElementById('sb-orgname');
  if(sbOrg&&org)sbOrg.textContent=org.name||'BizManager';
  // Set avatar initials
  var d2=od();var emp=d2.employees.find(function(e){return e.id===curEmpId;});
  var sbAv=document.getElementById('sb-avatar');
  if(sbAv)sbAv.textContent=emp?ini(emp.name):(curRole==='dir'?'Д':'М');
  document.getElementById('bnav').innerHTML = navTabs.map(function(t) {
    const inner = t==='more'
      ? '<span class="bni-icon" style="font-size:18px;font-weight:900">···</span>'
      : '<span class="bni-icon">'+tabSvg(t)+'</span>';
    return '<button class="bni" id="bni-'+t+'" onclick="goPage(\''+t+'\')">'
      + inner
      + '<span class="bni-label">'+TAB_NAMES[t]+'</span>'
      + '</button>';
  }).join('');
  document.getElementById('pages').innerHTML =
    allPages.map(function(t){
      return '<div class="pg" id="pg-'+t+'"><div class="wrap" id="w-'+t+'"></div></div>';
    }).join('');
}

function tabSvg(t) {
  const icons = {
    home:'<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3 10.5L11 3L19 10.5V19H15V14H7V19H3V10.5Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>',
    sale:'<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M8 11h6M11 8v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    sellers:'<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="8" cy="7" r="3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M2 18c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>',
    finance:'<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3 17l4-5 4 3 4-6 4 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 6h16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
    sale:'<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M8 11h6M11 8v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    sellers:'<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="9" cy="7" r="3" stroke="currentColor" stroke-width="1.8" fill="none"/><circle cx="15" cy="8" r="2.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M3 18c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M17 13c1.7.5 3 2.1 3 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    finance:'<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3 17l4-5 4 3 4-6 4 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 6h16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
    tasks:'<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="3" y="3" width="16" height="16" rx="4" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M7 11l3 3 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',

function goPage(id) {
  document.querySelectorAll('.bni').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  // Guard: mgr can only access their pages
  if(curRole==='mgr'){var allowedMgr=['home','sale','tasks'];if(allowedMgr.indexOf(id)<0){goPage('home');return;}}
  // Highlight correct nav button
  const navTabs = curRole==='dir'?TABS_DIR:TABS_MGR;
  const activeNav = navTabs.includes(id)?id:(curRole==='dir'&&!navTabs.includes(id)?'more':id);
  const btn = document.getElementById('bni-'+activeNav);
  if(btn) btn.classList.add('on');
  const pg = document.getElementById('pg-'+id);
  if(pg) pg.classList.add('on');
  // Update top title
  var tt=document.getElementById('top-user');if(tt)tt.textContent=TAB_NAMES[id]||id;
  const renders = {
    home:rHome, sale:rSale, sellers:rSellers, finance:rFinance, clients:rClients, invest:rInvest, plan:rPlan, plan:rPlan,
    cash:rCash, daily:rDaily, stock:rStock,
    salary:rSalary, taxes:rTaxes, defects:rDefects, tasks:rTasks,
    analytics:rAnalytics, abc:rABC, debts:rDebts, breakeven:rBE,
    report:rReport, settings:rSettings, mystat:rMyStat, more:rMore
  };
  renders[id]?.();
  if(['cash','clients','invest','daily','salary','taxes','defects','analytics','abc','debts','report','settings'].indexOf(id)>=0)setTimeout(function(){injectSideNav(id);},50);
  if(id==='tasks'||id==='home')setTimeout(startTaskTimer,200);
}

function mgrToggleTask(el){
  var id=parseInt(el.dataset.tid);
  var d=od();
  var tk=d.tasks.find(function(x){return x.id===id;});
  if(!tk)return;
  tk.done=!tk.done;
  var now=new Date();
  tk.doneTime=tk.done?(now.getHours()+':'+String(now.getMinutes()).padStart(2,'0')):null;
  if(tk.done&&tk.bonus>0){
    // Send to pending - director must approve
    if(!d.bonusRequests)d.bonusRequests=[];
    d.bonusRequests.push({
      id:gid(), taskId:tk.id, empId:tk.empId, empName:tk.empName,
      desc:'Бонус за задачу: '+tk.title, amt:tk.bonus, date:td(),
      doneTime:tk.doneTime, status:'pending'
    });
  } else if(!tk.done){
    // Remove pending request if unchecked
    if(d.bonusRequests)d.bonusRequests=d.bonusRequests.filter(function(r){return r.taskId!==tk.id;});
  }
  if(tk.done&&tk.fine>0){
    // Fine goes directly (director set it)
    if(!d.bfLog)d.bfLog=[];
    d.bfLog.push({id:gid(),empId:tk.empId,empName:tk.empName,
      desc:'Штраф: задача не выполнена вовремя: '+tk.title,
      amt:-tk.fine,date:td(),source:'task'});
  }
  sd(d);rHome();
}

function hTap(el){

  });

function hBuyerInput(){
  var inp=document.getElementById('h-buyer');if(!inp)return;
  var q=inp.value.trim();
  var drop=document.getElementById('h-buyer-drop');
  var badge=document.getElementById('h-buyer-badge');
  var newForm=document.getElementById('h-new-client');
  if(badge)badge.style.display='none';
  if(!q){if(drop)drop.style.display='none';if(newForm)newForm.style.display='none';return;}
  var d=od();if(!d.clients)d.clients=[];
  var matches=d.clients.filter(function(cl){
    var ql=q.toLowerCase();
    return cl.name.toLowerCase().includes(ql)||(cl.phone&&cl.phone.replace(/[^0-9]/g,'').includes(q.replace(/[^0-9]/g,'')));
  }).slice(0,6);
  if(!drop)return;
  drop.style.display='block';
  if(!matches.length){
    var isNum=q.replace(/[^0-9]/g,'').length>=4;
    drop.innerHTML='<div style="padding:8px 12px;font-size:12px;color:var(--tx3);font-weight:700">Клиент не найден</div>'
      +(isNum||q.length>=2?'<div onclick="hShowNewClient()" style="padding:10px 12px;cursor:pointer;font-size:12px;font-weight:800;color:var(--gr2);border-top:1px solid var(--br);background:var(--gr3)">➕ Добавить нового клиента</div>':'');
    return;
  }
  var rows='';
  matches.forEach(function(cl){
    rows+='<div data-cid="'+cl.id+'" onclick="hPickClient(this)" style="padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--br);background:#fff">';
    rows+='<div style="font-weight:800;font-size:13px">'+cl.name+(cl.phone?' <span style="color:var(--tx3);font-size:11px">'+cl.phone+'</span>':'')+'</div>';
    rows+='<div style="font-size:11px;color:var(--tx2);font-weight:700">'+( cl.visits||0)+' покупок · '+fm(cl.totalSpent||0)+'</div>';
    rows+='</div>';
  });
  rows+='<div onclick="hShowNewClient()" style="padding:9px 12px;cursor:pointer;font-size:12px;font-weight:800;color:var(--gr2);border-top:2px solid var(--br);background:var(--gr3)">➕ Добавить нового клиента</div>';
  drop.innerHTML=rows;
}

function hPickClient(el){
  var cid=parseInt(el.dataset.cid);
  var d=od();var cl=d.clients.find(function(x){return x.id===cid;});if(!cl)return;
  var inp=document.getElementById('h-buyer');if(inp)inp.value=cl.phone||cl.name;
  var drop=document.getElementById('h-buyer-drop');if(drop)drop.style.display='none';
  var badge=document.getElementById('h-buyer-badge');
  if(badge){badge.style.display='block';badge.innerHTML='✅ <b>'+cl.name+'</b>'+(cl.phone?' · '+cl.phone:'')+' · '+( cl.visits||0)+' покупок · '+fm(cl.totalSpent||0)+(cl.note?' · 📝 '+cl.note:'');}
  var nf=document.getElementById('h-new-client');if(nf)nf.style.display='none';
}

function hShowNewClient(){
  var drop=document.getElementById('h-buyer-drop');if(drop)drop.style.display='none';
  var form=document.getElementById('h-new-client');if(form)form.style.display='block';
  var inp=document.getElementById('h-buyer');
  var nameEl=document.getElementById('h-cl-name');
  var phoneEl=document.getElementById('h-cl-phone');
  if(inp&&nameEl&&phoneEl){
    var val=inp.value.trim();
    var isPhone=val.replace(/[^0-9]/g,'').length>=7;
    if(isPhone){phoneEl.value=val;nameEl.value='';}
    else{nameEl.value=val;phoneEl.value='';}
  }
  if(nameEl)nameEl.focus();
}

function hSaveNewClient(){
  var name=(document.getElementById('h-cl-name')?.value||'').trim();
  var phone=(document.getElementById('h-cl-phone')?.value||'').trim();
  if(!name&&!phone)return alert('Введите имя или телефон');
  var d=od();if(!d.clients)d.clients=[];
  var exist=phone?d.clients.find(function(cl){return cl.phone===phone;}):null;
  if(exist){hPickClient({dataset:{cid:exist.id}});hCancelNewClient();return;}
  var newCl={id:gid(),name:name||'Клиент',phone:phone,note:'',visits:0,totalSpent:0,firstVisit:td(),lastVisit:td(),lastProduct:''};
  d.clients.push(newCl);sd(d);
  var inp=document.getElementById('h-buyer');if(inp)inp.value=phone||name;
  var badge=document.getElementById('h-buyer-badge');
  if(badge){badge.style.display='block';badge.innerHTML='✅ Новый клиент сохранён: <b>'+(name||phone)+'</b>';}

}

function hCalc(){
  var d=od(),p=d.products.find(function(x){return x.id===hProdId;});
  var qty=parseInt(document.getElementById('h-qty')?.value)||0;
  var price=parseFloat(document.getElementById('h-price')?.value)||0;
  var disc=parseFloat(document.getElementById('h-disc')?.value)||0;
  var el=document.getElementById('h-calc');if(!el)return;
  if(!qty||!price){el.innerHTML='';return;}
  var fp=price*(1-disc/100);
  var total=fp*qty,cogs=(p?p.cost:0)*qty,cr=commRate(hCurPay),comm=total*cr/100,profit=total-cogs-comm;
  if(p&&qty>p.qty-p.sold){el.innerHTML='<div style="color:var(--re);font-size:12px;font-weight:800">⚠ Недостаточно!</div>';return;}
  var mc=profit/total*100>=30?'var(--gr)':profit/total*100>=10?'var(--ye)':'var(--re)';
  el.innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center;background:rgba(255,255,255,.7);border-radius:12px;padding:8px">'
    +'<div><div style="font-size:10px;color:var(--pu2);font-weight:700">К оплате</div><div style="font-size:16px;font-weight:900;color:var(--pu)">'+fm(total)+'</div></div>'
    +'<div><div style="font-size:10px;color:var(--tx2);font-weight:700">Прибыль</div><div style="font-size:16px;font-weight:900;color:'+mc+'">'+fm(profit)+'</div></div>'
    +'<div><div style="font-size:10px;color:var(--tx2);font-weight:700">Маржа</div><div style="font-size:16px;font-weight:900;color:'+mc+'">'+(total>0?(profit/total*100).toFixed(0):0)+'%</div></div>'
    +'</div>'+(disc>0?'<div style="font-size:11px;font-weight:700;color:var(--ye2);margin-top:4px;text-align:center">Скидка '+disc+'% · экономия '+fm(price*qty-total)+'</div>':'');
}

function hDoSale(){
  var d=od(),p=d.products.find(function(x){return x.id===hProdId;});
  if(!p)return alert('Выберите товар');
  var qty=parseInt(document.getElementById('h-qty')?.value)||0;
  var price=parseFloat(document.getElementById('h-price')?.value)||0;
  var disc=parseFloat(document.getElementById('h-disc')?.value)||0;
  if(!qty||!price)return alert('Укажите количество');
  if(qty>p.qty-p.sold)return alert('Недостаточно! Доступно: '+(p.qty-p.sold)+' шт');
  var fp=price*(1-disc/100);
  var total=fp*qty,cogs=p.cost*qty,cr=commRate(hCurPay),comm=total*cr/100;
  var seller=d.employees.find(function(e){return e.id===hCurSeller;});
  p.sold=(p.sold||0)+qty;
  var now=new Date();
  var sale={id:gid(),prodId:p.id,prodName:p.name,prodPhoto:p.photo||'',qty:qty,price:fp,ed:disc,
    total:total,cogs:cogs,commission:comm,commRate:cr,profit:total-cogs-comm,pay:hCurPay,
    sellerId:seller?seller.id:null,sellerName:seller?seller.name:null,buyer:'',date:td(),
    time:now.getHours()+':'+String(now.getMinutes()).padStart(2,'0'),screen:'',
    no:'#'+String(d.sales.length+1).padStart(4,'0')};
  d.sales.unshift(sale);
  // Auto-save client
  if(sale.buyer&&sale.buyer.trim()){
    if(!d.clients)d.clients=[];
    var existing=d.clients.find(function(cl){return cl.name.toLowerCase()===sale.buyer.toLowerCase().trim()||cl.phone===sale.buyer.trim();});
    if(existing){
      existing.visits=(existing.visits||0)+1;
      existing.totalSpent=(existing.totalSpent||0)+sale.total;
      existing.lastVisit=sale.date;
      existing.lastProduct=sale.prodName;
    } else {
      var isPhone=sale.buyer.trim().replace(/[^0-9]/g,'').length>=7;
      d.clients.push({id:gid(),name:isPhone?'Клиент':sale.buyer.trim(),phone:isPhone?sale.buyer.trim():'',visits:1,totalSpent:sale.total,firstVisit:sale.date,lastVisit:sale.date,lastProduct:sale.prodName,note:''});
    }
  }
  sd(d);
  var rcpt=document.getElementById('h-rcpt');
  if(rcpt){
    rcpt.style.display='block';
    rcpt.innerHTML='<div class="card" style="border:2px solid var(--gr);text-align:center;padding:18px;margin-top:8px">'
      +'<div style="font-size:36px">✅</div>'
      +'<div style="font-size:18px;font-weight:900;color:var(--gr)">Продано!</div>'
      +'<div style="font-size:15px;font-weight:700;color:var(--tx);margin-top:4px">'+p.name+' × '+qty+' шт</div>'
      +'<div style="font-size:24px;font-weight:900;color:var(--pu);margin:6px 0">'+fm(total)+'</div>'
      +(disc>0?'<div style="font-size:12px;color:var(--ye2);font-weight:700">Скидка '+disc+'%</div>':'')
      +'<div style="font-size:12px;color:var(--tx2);font-weight:700">'+PL[hCurPay]+' · '+sale.no+'</div>'
      +'<button class="btn" onclick="hCloseRcpt()" style="margin-top:12px">Закрыть</button>'
      +'</div>';
    setTimeout(function(){hCloseRcpt();},5000);
  }
  hProdId=0;hCurPay='cash';
  rHome();
}

function hBEWidget(d,t){
  var fixedM=(d.cfg.rent||0)+(d.cfg.util||0)+(d.cfg.ads||0)+(d.cfg.pen||0)+d.employees.reduce(function(a,e){return a+e.fix;},0)+(d.customExp||[]).reduce(function(a,e){return a+e.amt;},0);
  if(!fixedM)return'';
  var avgP=d.sales.length?d.sales.reduce(function(a,s){return a+s.price;},0)/d.sales.length:0;
  var avgC=d.sales.length?d.sales.reduce(function(a,s){return a+s.cogs/Math.max(s.qty,1);},0)/d.sales.length:0;
  var beDay=Math.ceil(fixedM/26);
  var todayR=d.sales.filter(function(s){return s.date===t;}).reduce(function(a,s){return a+s.total;},0);
  var done=beDay>0?Math.min(todayR/beDay*100,100):100;
  var left=Math.max(0,beDay-todayR);
  var ok=(done>=100);
  var margin=avgP-avgC;
  var leftUnits=margin>0?Math.ceil(left/margin):0;
  var h='<div style="background:'+(ok?'var(--gr3)':'#fff')+';border-radius:20px;padding:14px;margin-bottom:12px;border:2px solid '+(ok?'var(--gr)':'var(--br)')+';box-shadow:0 2px 10px rgba(0,0,0,.06)">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
  h+='<div><div style="font-size:13px;font-weight:900;color:var(--tx)">⚖️ Точка безубыточности</div>';
  h+='<div style="font-size:11px;color:var(--tx3);font-weight:600">дневной план: '+fm(beDay)+'</div></div>';
  h+='<div style="font-size:24px;font-weight:900;color:'+(ok?'var(--gr)':'var(--ye)')+'">'+Math.round(done)+'%</div>';
  h+='</div>';
  h+='<div style="background:var(--bg);border-radius:8px;height:10px;overflow:hidden;margin-bottom:10px">';
  h+='<div style="height:100%;border-radius:8px;background:'+(ok?'var(--gr)':'linear-gradient(90deg,var(--ye),var(--pu))')+';width:'+Math.min(Math.round(done),100)+'%"></div></div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center">';
  h+='<div style="background:var(--bg);border-radius:12px;padding:8px"><div style="font-size:10px;color:var(--tx2);font-weight:700">План/день</div><div style="font-size:14px;font-weight:900;color:var(--bl)">'+fm(beDay)+'</div></div>';
  h+='<div style="background:var(--bg);border-radius:12px;padding:8px"><div style="font-size:10px;color:var(--tx2);font-weight:700">Продано</div><div style="font-size:14px;font-weight:900;color:'+(ok?'var(--gr)':'var(--pu)')+'">'+fm(todayR)+'</div></div>';
  h+='<div style="background:var(--bg);border-radius:12px;padding:8px"><div style="font-size:10px;color:var(--tx2);font-weight:700">'+(ok?'✅ Готово!':'Осталось')+'</div><div style="font-size:14px;font-weight:900;color:'+(ok?'var(--gr)':'var(--re)')+'">'+fm(ok?todayR-beDay:left)+'</div></div>';
  h+='</div>';
  if(!ok&&leftUnits>0)h+='<div style="margin-top:8px;text-align:center;font-size:12px;font-weight:700;color:var(--tx2)">Осталось продать ≈ <b style="color:var(--re)">'+leftUnits+' ед.</b> (при ср. цене '+fm(Math.round(avgP))+')</div>';
  if(ok)h+='<div style="margin-top:8px;text-align:center;font-size:12px;font-weight:800;color:var(--gr2)">🎉 Дневной план выполнен! Это уже прибыль</div>';
  h+='</div>';
  return h;
}

function doHWd2(){

function hSelProd(id){
  const d=od();
  const p=id?d.products.find(function(x){return x.id===id;}):null;
  if(p&&p.qty-p.sold<=0){alert('Товар закончился!');return;}
  hProdId=id;
  // Update card borders
  d.products.filter(function(pr){return pr.qty-pr.sold>0;}).forEach(function(pr){
    const el=document.getElementById('hpg-'+pr.id);
    if(!el)return;
    const sel=pr.id===id;
    el.style.borderColor=sel?'var(--pu)':'var(--br)';
    el.style.boxShadow=sel?'0 0 0 3px var(--pu3)':'0 2px 8px rgba(0,0,0,.06)';
    var ck=el.querySelector('.hck');
    if(sel&&!ck){
      var div=document.createElement('div');
      div.className='hck';
      div.style.cssText='position:absolute;top:5px;right:5px;width:14px;height:14px;border-radius:50%;background:var(--pu);display:flex;align-items:center;justify-content:center';
      div.innerHTML='<svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M1 4l2 2 4-4" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>';
      el.appendChild(div);
    } else if(!sel&&ck){ck.remove();}
  });
  // Update panel
  const panel=document.getElementById('h-sale-panel');
  if(!panel)return;
  if(id&&p){
    hCurPay='cash';
    panel.style.display='block';
    panel.innerHTML=hSalePanelHTML(d);
    hCalc();
    panel.scrollIntoView({behavior:'smooth',block:'nearest'});
  } else {
    panel.style.display='none';
    panel.innerHTML='';
  }
}

function hCalc(){
  const d=od();
  const p=d.products.find(function(x){return x.id===hProdId;});
  const qty=parseInt(document.getElementById('h-qty')?.value)||0;
  const price=parseFloat(document.getElementById('h-price')?.value)||0;
  const el=document.getElementById('h-calc');if(!el)return;
  if(!qty||!price||!p){el.innerHTML='';return;}
  if(qty>p.qty-p.sold){el.innerHTML='<div style="color:var(--re);font-size:12px;font-weight:800">⚠ Недостаточно! Доступно: '+(p.qty-p.sold)+'шт</div>';return;}
  const total=price*qty;
  const cogs=p.cost*qty;
  const cr=commRate(hCurPay);
  const comm=total*cr/100;
  const profit=total-cogs-comm;
  const mc=profit/total*100>=30?'var(--gr)':profit/total*100>=10?'var(--ye)':'var(--re)';
  el.innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center">'
    +'<div style="background:#fff;border-radius:12px;padding:8px"><div style="font-size:10px;color:var(--pu2);font-weight:700">К оплате</div><div style="font-size:16px;font-weight:900;color:var(--pu)">'+fm(total)+'</div></div>'
    +'<div style="background:#fff;border-radius:12px;padding:8px"><div style="font-size:10px;color:var(--tx2);font-weight:700">Прибыль</div><div style="font-size:16px;font-weight:900;color:'+mc+'">'+fm(profit)+'</div></div>'
    +'<div style="background:#fff;border-radius:12px;padding:8px"><div style="font-size:10px;color:var(--tx2);font-weight:700">Маржа</div><div style="font-size:16px;font-weight:900;color:'+mc+'">'+(total>0?(profit/total*100).toFixed(0):0)+'%</div></div>'
    +'</div>'+(cr>0?'<div style="font-size:11px;font-weight:700;color:var(--tx2);margin-top:5px">Комиссия '+PL[hCurPay]+' '+cr+'%: <b style="color:var(--re)">-'+fm(comm)+'</b></div>':'');
}

function hDoSale(){
  const d=od();
  const p=d.products.find(function(x){return x.id===hProdId;});
  if(!p)return alert('Выберите товар');
  const qty=parseInt(document.getElementById('h-qty')?.value)||0;
  const price=parseFloat(document.getElementById('h-price')?.value)||0;
  if(!qty||!price)return alert('Укажите количество и цену');
  if(qty>p.qty-p.sold)return alert('Недостаточно! Доступно: '+(p.qty-p.sold)+'шт');
  const total=price*qty;
  const cogs=p.cost*qty;
  const cr=commRate(hCurPay);
  const comm=total*cr/100;
  const seller=d.employees.find(function(e){return e.id===hCurSeller;});
  p.sold=(p.sold||0)+qty;
  const now=new Date();
  const sale={
    id:gid(),prodId:p.id,prodName:p.name,prodPhoto:p.photo||'',
    qty:qty,price:price,ed:0,total:total,cogs:cogs,
    commission:comm,commRate:cr,profit:total-cogs-comm,
    pay:hCurPay,sellerId:seller?seller.id:null,sellerName:seller?seller.name:null,
    buyer:(document.getElementById('sl-buyer')?.value||'').trim(),date:td(),
    time:now.getHours()+':'+String(now.getMinutes()).padStart(2,'0'),
    screen:'',no:'#'+String(d.sales.length+1).padStart(4,'0')
  };
  d.sales.unshift(sale);
  // Auto-save client
  if(sale.buyer&&sale.buyer.trim()){
    if(!d.clients)d.clients=[];
    var existing=d.clients.find(function(cl){return cl.name.toLowerCase()===sale.buyer.toLowerCase().trim()||cl.phone===sale.buyer.trim();});
    if(existing){
      existing.visits=(existing.visits||0)+1;
      existing.totalSpent=(existing.totalSpent||0)+sale.total;
      existing.lastVisit=sale.date;
      existing.lastProduct=sale.prodName;
    } else {
      var isPhone=sale.buyer.trim().replace(/[^0-9]/g,'').length>=7;
      d.clients.push({id:gid(),name:isPhone?'Клиент':sale.buyer.trim(),phone:isPhone?sale.buyer.trim():'',visits:1,totalSpent:sale.total,firstVisit:sale.date,lastVisit:sale.date,lastProduct:sale.prodName,note:''});
    }
  }
  sd(d);
  // Show mini receipt
  const rcpt=document.getElementById('h-rcpt');
  if(rcpt){
    rcpt.style.display='block';
    rcpt.innerHTML='<div class="card" style="border:2px solid var(--gr);text-align:center;padding:16px">'
      +'<div style="font-size:22px;margin-bottom:6px">✅</div>'
      +'<div style="font-size:16px;font-weight:900;color:var(--gr)">Продано!</div>'
      +'<div style="font-size:14px;font-weight:700;color:var(--tx);margin-top:4px">'+p.name+' × '+qty+'шт</div>'
      +'<div style="font-size:22px;font-weight:900;color:var(--pu);margin-top:4px">'+fm(total)+'</div>'
      +'<div style="font-size:12px;color:var(--tx2);font-weight:700;margin-top:2px">Чек '+sale.no+' · '+PL[hCurPay]+'</div>'
      +'<button class="btn" onclick="document.getElementById(\'h-rcpt\').style.display=\'none\'" style="margin-top:10px">Закрыть</button>'
      +'</div>';
    setTimeout(function(){if(rcpt)rcpt.style.display='none';},4000);
  }
  // Reset and refresh
  hProdId=0;
  hCurPay='cash';
  rHome();
}

function hBEWidget(d,t){
  var fixedM=(d.cfg.rent||0)+(d.cfg.util||0)+(d.cfg.ads||0)+(d.cfg.pen||0)+d.employees.reduce(function(a,e){return a+e.fix;},0)+(d.customExp||[]).reduce(function(a,e){return a+e.amt;},0);
  if(!fixedM)return'';
  var avgP=d.sales.length?d.sales.reduce(function(a,s){return a+s.price;},0)/d.sales.length:0;
  var avgC=d.sales.length?d.sales.reduce(function(a,s){return a+s.cogs/Math.max(s.qty,1);},0)/d.sales.length:0;
  var beDay=Math.ceil(fixedM/26);
  var todayR=d.sales.filter(function(s){return s.date===t;}).reduce(function(a,s){return a+s.total;},0);
  var done=beDay>0?Math.min(todayR/beDay*100,100):100;
  var left=Math.max(0,beDay-todayR);
  var ok=(done>=100);
  var margin=avgP-avgC;
  var leftUnits=margin>0?Math.ceil(left/margin):0;
  var h='<div style="background:'+(ok?'var(--gr3)':'#fff')+';border-radius:20px;padding:14px;margin-bottom:12px;border:2px solid '+(ok?'var(--gr)':'var(--br)')+';box-shadow:0 2px 10px rgba(0,0,0,.06)">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
  h+='<div><div style="font-size:13px;font-weight:900;color:var(--tx)">⚖️ Точка безубыточности</div>';
  h+='<div style="font-size:11px;color:var(--tx3);font-weight:600">дневной план: '+fm(beDay)+'</div></div>';
  h+='<div style="font-size:24px;font-weight:900;color:'+(ok?'var(--gr)':'var(--ye)')+'">'+Math.round(done)+'%</div>';
  h+='</div>';
  h+='<div style="background:var(--bg);border-radius:8px;height:10px;overflow:hidden;margin-bottom:10px">';
  h+='<div style="height:100%;border-radius:8px;background:'+(ok?'var(--gr)':'linear-gradient(90deg,var(--ye),var(--pu))')+';width:'+Math.min(Math.round(done),100)+'%"></div></div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center">';
  h+='<div style="background:var(--bg);border-radius:12px;padding:8px"><div style="font-size:10px;color:var(--tx2);font-weight:700">План/день</div><div style="font-size:14px;font-weight:900;color:var(--bl)">'+fm(beDay)+'</div></div>';
  h+='<div style="background:var(--bg);border-radius:12px;padding:8px"><div style="font-size:10px;color:var(--tx2);font-weight:700">Продано</div><div style="font-size:14px;font-weight:900;color:'+(ok?'var(--gr)':'var(--pu)')+'">'+fm(todayR)+'</div></div>';
  h+='<div style="background:var(--bg);border-radius:12px;padding:8px"><div style="font-size:10px;color:var(--tx2);font-weight:700">'+(ok?'✅ Готово!':'Осталось')+'</div><div style="font-size:14px;font-weight:900;color:'+(ok?'var(--gr)':'var(--re)')+'">'+fm(ok?todayR-beDay:left)+'</div></div>';
  h+='</div>';
  if(!ok&&leftUnits>0)h+='<div style="margin-top:8px;text-align:center;font-size:12px;font-weight:700;color:var(--tx2)">Осталось продать ≈ <b style="color:var(--re)">'+leftUnits+' ед.</b> (при ср. цене '+fm(Math.round(avgP))+')</div>';
  if(ok)h+='<div style="margin-top:8px;text-align:center;font-size:12px;font-weight:800;color:var(--gr2)">🎉 Дневной план выполнен! Это уже прибыль</div>';
  h+='</div>';
  return h;
}

function calcS(){
  const d=od();const id=parseInt(document.getElementById('sp-prod')?.value);
  const p=d.products.find(x=>x.id===id);
  const qty=parseInt(document.getElementById('sp-q')?.value)||0;
  const price=parseFloat(document.getElementById('sp-p')?.value)||0;
  const ed=parseFloat(document.getElementById('sp-d')?.value)||0;
  const fp=price*(1-ed/100);const total=fp*qty;const cogs=(p?p.cost:0)*qty;
  const cr=commRate(curPay);const comm=total*cr/100;const profit=total-cogs-comm;
  const pc2=document.getElementById('pay-comm'); if(pc2)pc2.innerHTML=curPay!=='cash'&&cr>0?`<div style="font-size:11px;background:var(--bg);border-radius:10px;padding:4px 9px;margin-bottom:3px;color:var(--tx2);font-weight:700">Комиссия ${PL[curPay]} ${cr}% = <b style="color:var(--re)">${fm(comm)}</b></div>`:'';
  const sc=document.getElementById('sale-calc'); if(!sc)return;
  if(!qty||!price){sc.innerHTML='';return;}
  if(p&&qty>p.qty-p.sold){sc.innerHTML=`<div style="color:var(--re);font-size:12px;font-weight:800">⚠ Недостаточно! Доступно: ${p.qty-p.sold}шт</div>`;return;}
  const mc=profit/total*100>=30?'var(--gr)':profit/total*100>=10?'var(--ye)':'var(--re)';
  sc.innerHTML=`<div style="background:var(--bg);border-radius:14px;padding:9px 11px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin:5px 0">
    <div><div style="font-size:10px;color:var(--tx3);font-weight:700">Итого</div><div style="font-size:13px;font-weight:900;color:var(--gr)">${fm(total)}</div></div>
    <div><div style="font-size:10px;color:var(--tx3);font-weight:700">Себест.</div><div style="font-size:13px;font-weight:900;color:var(--re)">${fm(cogs)}</div></div>
    <div><div style="font-size:10px;color:var(--tx3);font-weight:700">Комиссия</div><div style="font-size:13px;font-weight:900;color:var(--ye)">${fm(comm)}</div></div>
    <div><div style="font-size:10px;color:var(--tx3);font-weight:700">Прибыль</div><div style="font-size:13px;font-weight:900;color:${mc}">${fm(profit)}</div></div>
  </div>`;
}

function makeSale(){
  const d=od();const id=parseInt(document.getElementById('sp-prod')?.value);
  const p=d.products.find(x=>x.id===id);if(!p)return alert('Выберите товар');
  const qty=parseInt(document.getElementById('sp-q')?.value)||0;
  const price=parseFloat(document.getElementById('sp-p')?.value)||0;
  if(!qty||!price)return alert('Укажите количество и цену');
  if(qty>p.qty-p.sold)return alert(`Недостаточно! Доступно: ${p.qty-p.sold}шт`);
  const ed=parseFloat(document.getElementById('sp-d')?.value)||0;
  const fp=price*(1-ed/100);const total=fp*qty;const cogs=p.cost*qty;
  const cr=commRate(curPay);const comm=total*cr/100;
  const seller=d.employees.find(e=>e.id===curSeller);
  const scr=document.getElementById('sc-prev')?.dataset?.src||'';
  p.sold=(p.sold||0)+qty;
  const now=new Date();
  const sale={id:gid(),prodId:p.id,prodName:p.name,prodPhoto:p.photo||'',qty,price:fp,ed,
    total,cogs,commission:comm,commRate:cr,profit:total-cogs-comm,pay:curPay,
    sellerId:seller?.id||null,sellerName:seller?.name||null,
    buyer:document.getElementById('sp-b')?.value||'',
    date:document.getElementById('sp-dt')?.value||td(),
    time:now.getHours()+':'+String(now.getMinutes()).padStart(2,'0'),
    screen:scr,no:'#'+String(d.sales.length+1).padStart(4,'0')};
  d.sales.unshift(sale);
  // Auto-save client
  if(sale.buyer&&sale.buyer.trim()){
    if(!d.clients)d.clients=[];
    var existing=d.clients.find(function(cl){return cl.name.toLowerCase()===sale.buyer.toLowerCase().trim()||cl.phone===sale.buyer.trim();});
    if(existing){
      existing.visits=(existing.visits||0)+1;
      existing.totalSpent=(existing.totalSpent||0)+sale.total;
      existing.lastVisit=sale.date;
      existing.lastProduct=sale.prodName;
    } else {
      var isPhone=sale.buyer.trim().replace(/[^0-9]/g,'').length>=7;
      d.clients.push({id:gid(),name:isPhone?'Клиент':sale.buyer.trim(),phone:isPhone?sale.buyer.trim():'',visits:1,totalSpent:sale.total,firstVisit:sale.date,lastVisit:sale.date,lastProduct:sale.prodName,note:''});
    }
  }
  sd(d);
  showReceipt(sale);clearSale();rTodaySales();rCashNow();
}

function delSale(id){
  if(!confirm('Удалить продажу?'))return;
  const d=od();const s=d.sales.find(x=>x.id===id);
  if(s){const p=d.products.find(x=>x.id===s.prodId);if(p)p.sold=Math.max(0,(p.sold||0)-s.qty);}
  d.sales=d.sales.filter(x=>x.id!==id);sd(d);rTodaySales();rCashNow();
}

function openPhotoViewer(src, name){
  var existing=document.getElementById('photo-viewer-overlay');
  if(existing)existing.remove();
  var div=document.createElement('div');
  div.id='photo-viewer-overlay';
  div.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;cursor:pointer';
  div.onclick=function(){div.remove();};
  div.innerHTML='<div style="font-size:14px;font-weight:800;color:#fff;margin-bottom:12px;text-align:center">'+name+'</div>'
    +'<img src="'+src+'" style="max-width:100%;max-height:70vh;object-fit:contain;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)">'
    +'<div style="color:rgba(255,255,255,.6);font-size:12px;font-weight:600;margin-top:12px">Нажмите чтобы закрыть</div>';
  document.body.appendChild(div);
}


var selectedProds=new Set();
var slCart=[], slCurPay='cash', slCurSeller=null, slProdId=0;

function slAddToCart(prodId){
  var d=od();
  var p=d.products.find(function(x){return x.id===prodId;});
  if(!p)return;
  var rem=p.qty-p.sold;
  var existing=slCart.find(function(ci){return ci.prodId===prodId;});
  if(existing){
    if(existing.qty>=rem){
      // Show pulse effect instead of alert
      var el=document.querySelector('[data-id="'+prodId+'"]');
      if(el){el.style.border='2.5px solid var(--re)';setTimeout(function(){el.style.border='2.5px solid var(--pu)';},400);}
      return;
    }
    existing.qty++;
  } else {
    slCart.push({prodId:prodId,qty:1,price:p.salePrice,disc:0});
  }
  rSale();
}

function cartQty(btn, delta){
  var pid=parseInt(btn.dataset.pid);
  var ci=slCart.find(function(x){return x.prodId===pid;});
  if(!ci)return;
  var d=od();var p=d.products.find(function(x){return x.id===pid;});
  var rem=p?p.qty-p.sold:999;
  ci.qty=Math.max(1,Math.min(rem,ci.qty+delta));
  rSale();
}

function cartDisc(inp){
  var pid=parseInt(inp.dataset.pid);
  var ci=slCart.find(function(x){return x.prodId===pid;});
  if(ci)ci.disc=Math.max(0,Math.min(100,parseFloat(inp.value)||0));
  // Update total without full re-render
  rSale();
}

function removeFromCart(btn){
  var pid=parseInt(btn.dataset.pid);
  slCart=slCart.filter(function(x){return x.prodId!==pid;});
  rSale();
}

function clearCart(){
  slCart=[];slCurPay='cash';rSale();
}

function slDoCartSale(){
  if(!slCart.length)return alert('Корзина пуста');
  var d=od();
  var now=new Date();
  var buyer=document.getElementById('sl-b')?.value||'';
  var seller=d.employees.find(function(e){return e.id===slCurSeller;});
  var saleNos=[];
  var allOk=true;
  // Validate all
  slCart.forEach(function(ci){
    var p=d.products.find(function(x){return x.id===ci.prodId;});
    if(!p||ci.qty>p.qty-p.sold){allOk=false;}
  });
  if(!allOk)return alert('Недостаточно товара! Проверьте остатки');
  // Process all cart items as separate sales
  slCart.forEach(function(ci){
    var p=d.products.find(function(x){return x.id===ci.prodId;});
    var fp=ci.price*(1-ci.disc/100);
    var total=fp*ci.qty;
    var cogs=p.cost*ci.qty;
    var cr=commRate(slCurPay);
    var comm=total*cr/100;
    p.sold=(p.sold||0)+ci.qty;
    var sale={id:gid(),prodId:p.id,prodName:p.name,prodPhoto:p.photo||'',
      qty:ci.qty,price:fp,ed:ci.disc,total:total,cogs:cogs,
      commission:comm,commRate:cr,profit:total-cogs-comm,pay:slCurPay,
      sellerId:seller?seller.id:null,sellerName:seller?seller.name:null,
      buyer:buyer,date:td(),
      time:now.getHours()+':'+String(now.getMinutes()).padStart(2,'0'),
      screen:'',no:'#'+String(d.sales.length+1).padStart(4,'0')};
    // Auto-save client
    if(buyer&&buyer.trim()){
      if(!d.clients)d.clients=[];
      var existing=d.clients.find(function(cl){return cl.name.toLowerCase()===buyer.toLowerCase().trim()||cl.phone===buyer.trim();});
      if(existing){existing.visits=(existing.visits||0)+1;existing.totalSpent=(existing.totalSpent||0)+total;existing.lastVisit=sale.date;existing.lastProduct=p.name;}
      else{var isPhone=buyer.trim().replace(/[^0-9]/g,'').length>=7;d.clients.push({id:gid(),name:isPhone?'Клиент':buyer.trim(),phone:isPhone?buyer.trim():'',visits:1,totalSpent:total,firstVisit:td(),lastVisit:td(),lastProduct:p.name,note:''});}
    }
    d.sales.unshift(sale);
    saleNos.push(sale.no);
  });
  sd(d);
  var cartTotal=slCart.reduce(function(a,ci){return a+ci.price*(1-ci.disc/100)*ci.qty;},0);
  var itemCount=slCart.length;
  var cartItems=slCart.slice();slCart=[];slCurPay='cash';
  // Show success
  var rcpt=document.getElementById('sl-rcpt');
  if(rcpt){
    rcpt.style.display='block';
    rcpt.innerHTML=buildCartReceipt(cartItems,cartTotal,slCurPay,saleNos,seller,buyer);
    rcpt.scrollIntoView({behavior:'smooth',block:'start'});
  }
  rSale();
}

function slClientInput(){

  var drop=document.getElementById('sl-b-drop');
  var badge=document.getElementById('sl-client-badge');
  var newForm=document.getElementById('sl-new-client');
  if(badge){badge.style.display='none';badge.innerHTML='';}
  if(!q){if(drop)drop.style.display='none';if(newForm)newForm.style.display='none';return;}
  var d=od();if(!d.clients)d.clients=[];
  var matches=d.clients.filter(function(cl){
    return cl.name.toLowerCase().includes(q.toLowerCase())||
      (cl.phone&&cl.phone.replace(/[^0-9]/g,'').includes(q.replace(/[^0-9]/g,'')));
  }).slice(0,6);
  if(drop){
    if(matches.length){
      drop.style.display='block';

function slShowNewClientForm(){
  var drop=document.getElementById('sl-b-drop');if(drop)drop.style.display='none';
  var form=document.getElementById('sl-new-client');if(form)form.style.display='block';
  // Pre-fill name from input
  var inp=document.getElementById('sl-b');
  var nameEl=document.getElementById('sl-cl-name');
  var phoneEl=document.getElementById('sl-cl-phone');
  if(inp&&nameEl&&phoneEl){
    var val=inp.value.trim();

    if(isPhone){phoneEl.value=val;nameEl.value='';}

function slSaveNewClient(){
  var name=(document.getElementById('sl-cl-name')?.value||'').trim();
  var phone=(document.getElementById('sl-cl-phone')?.value||'').trim();
  if(!name&&!phone)return alert('Введите имя или телефон');
  var d=od();if(!d.clients)d.clients=[];
  if(phone&&d.clients.find(function(cl){return cl.phone===phone;})){
    // Duplicate phone - just select existing
    var existing=d.clients.find(function(cl){return cl.phone===phone;});
    slPickClient({dataset:{cid:existing.id}});
    slCancelNewClient();
    return;
  }
  var newCl={id:gid(),name:name||'Клиент',phone:phone,note:'',visits:0,totalSpent:0,firstVisit:td(),lastVisit:td(),lastProduct:''};
  d.clients.push(newCl);sd(d);

function slQty(d){var el=document.getElementById('sl-q');if(!el)return;var prod=od().products.find(function(x){return x.id===slProdId;});el.value=Math.max(1,Math.min(prod?prod.qty-prod.sold:999,(parseInt(el.value)||1)+d));slCalc();}
function slSetPay(btn){if(!btn)return;slCurPay=btn.dataset.pay;document.querySelectorAll('.pay-opt').forEach(function(b){b.className='pay-opt';});btn.classList.add('sel-'+slCurPay);slCalc();}

function slCalc(){
  var d=od(), p=d.products.find(function(x){return x.id===slProdId;});
  var qty=parseInt(document.getElementById('sl-q')?.value)||0;
  var price=parseFloat(document.getElementById('sl-p')?.value)||0;
  var ce=document.getElementById('sl-calc'), cm=document.getElementById('sl-comm');
  if(!ce)return;
  if(!qty||!price){ce.innerHTML='';if(cm)cm.innerHTML='';return;}
  if(p&&qty>p.qty-p.sold){ce.innerHTML='<div style="color:var(--re);font-size:13px;font-weight:800">⚠ Недостаточно! Доступно: '+(p.qty-p.sold)+' шт</div>';return;}
  var total=price*qty, cogs=(p?p.cost:0)*qty, cr=commRate(slCurPay), comm=total*cr/100, profit=total-cogs-comm;
  var mc=profit/total*100>=30?'var(--gr)':profit/total*100>=10?'var(--ye)':'var(--re)';
  if(cm)cm.innerHTML=cr>0?'<div style="font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:6px">Комиссия '+PL[slCurPay]+' '+cr+'%: <b style="color:var(--re)">-'+fm(comm)+'</b></div>':'';

function slDoSale(){
  var d=od(), p=d.products.find(function(x){return x.id===slProdId;});
  if(!p)return alert('Выберите товар');
  var qty=parseInt(document.getElementById('sl-q')?.value)||0;
  var price=parseFloat(document.getElementById('sl-p')?.value)||0;
  if(!qty||!price)return alert('Укажите количество и цену');
  if(qty>p.qty-p.sold)return alert('Недостаточно! Доступно: '+(p.qty-p.sold)+' шт');
  var total=price*qty, cogs=p.cost*qty, cr=commRate(slCurPay), comm=total*cr/100;
  var seller=d.employees.find(function(e){return e.id===slCurSeller;});
  p.sold=(p.sold||0)+qty;
  var now=new Date();
  var sale={id:gid(),prodId:p.id,prodName:p.name,prodPhoto:p.photo||'',qty:qty,price:price,ed:0,
    total:total,cogs:cogs,commission:comm,commRate:cr,profit:total-cogs-comm,pay:slCurPay,
    sellerId:seller?seller.id:null,sellerName:seller?seller.name:null,buyer:'',date:td(),
    time:now.getHours()+':'+String(now.getMinutes()).padStart(2,'0'),
    screen:'',no:'#'+String(d.sales.length+1).padStart(4,'0')};
  d.sales.unshift(sale);
  // Auto-save client
  if(sale.buyer&&sale.buyer.trim()){
    if(!d.clients)d.clients=[];
    var existing=d.clients.find(function(cl){return cl.name.toLowerCase()===sale.buyer.toLowerCase().trim()||cl.phone===sale.buyer.trim();});
    if(existing){
      existing.visits=(existing.visits||0)+1;
      existing.totalSpent=(existing.totalSpent||0)+sale.total;
      existing.lastVisit=sale.date;
      existing.lastProduct=sale.prodName;
    } else {
      var isPhone=sale.buyer.trim().replace(/[^0-9]/g,'').length>=7;
      d.clients.push({id:gid(),name:isPhone?'Клиент':sale.buyer.trim(),phone:isPhone?sale.buyer.trim():'',visits:1,totalSpent:sale.total,firstVisit:sale.date,lastVisit:sale.date,lastProduct:sale.prodName,note:''});
    }
  }
  sd(d);
  var rcpt=document.getElementById('sl-rcpt');
  if(rcpt){
    rcpt.style.display='block';
    rcpt.innerHTML='<div class="card" style="border:2px solid var(--gr);text-align:center;padding:20px;margin-bottom:4px">'
      +'<div style="font-size:40px;margin-bottom:8px">✅</div>'
      +'<div style="font-size:20px;font-weight:900;color:var(--gr)">Продано!</div>'
      +'<div style="font-size:15px;font-weight:700;color:var(--tx);margin-top:6px">'+p.name+' × '+qty+' шт</div>'
      +'<div style="font-size:26px;font-weight:900;color:var(--pu);margin:6px 0">'+fm(total)+'</div>'
      +'<div style="font-size:13px;color:var(--tx2);font-weight:700">'+PL[slCurPay]+' · Чек '+sale.no+'</div>'
      +'<button class="btn" onclick="slCloseRcpt()" style="margin-top:14px;padding:10px 24px">Закрыть</button>'
      +'</div>';
    setTimeout(function(){slCloseRcpt();},5000);
  }
  slProdId=0;slCurPay='cash';
  rSale();
}

function slShowNewClientForm(){
  var drop=document.getElementById('sl-b-drop');if(drop)drop.style.display='none';
  var form=document.getElementById('sl-new-client');if(form)form.style.display='block';
  // Pre-fill name from input
  var inp=document.getElementById('sl-b');

  var phoneEl=document.getElementById('sl-cl-phone');

    var val=inp.value.trim();

    if(isPhone){phoneEl.value=val;nameEl.value='';}
    else{nameEl.value=val;phoneEl.value='';}
  }
  if(nameEl)nameEl.focus();
}

function slSaveNewClient(){
  var name=(document.getElementById('sl-cl-name')?.value||'').trim();
  var phone=(document.getElementById('sl-cl-phone')?.value||'').trim();
  if(!name&&!phone)return alert('Введите имя или телефон');
  var d=od();if(!d.clients)d.clients=[];
  if(phone&&d.clients.find(function(cl){return cl.phone===phone;})){
    // Duplicate phone - just select existing
    var existing=d.clients.find(function(cl){return cl.phone===phone;});
    slPickClient({dataset:{cid:existing.id}});
    slCancelNewClient();
    return;
  }
  var newCl={id:gid(),name:name||'Клиент',phone:phone,note:'',visits:0,totalSpent:0,firstVisit:td(),lastVisit:td(),lastProduct:''};
  d.clients.push(newCl);sd(d);

  var inp=document.getElementById('sl-b');if(inp)inp.value=phone||name;

}

function calcSl(){
  const d=od();const id=parseInt(document.getElementById('sl-prod')?.value);
  const p=d.products.find(x=>x.id===id);
  const qty=parseInt(document.getElementById('sl-q')?.value)||0;
  const price=parseFloat(document.getElementById('sl-p')?.value)||0;
  const ed=parseFloat(document.getElementById('sl-d')?.value)||0;
  const fp=price*(1-ed/100);const total=fp*qty;const cogs=(p?p.cost:0)*qty;
  const cr=commRate(slCurPay);const comm=total*cr/100;const profit=total-cogs-comm;
  const commEl=document.getElementById('sl-comm');if(commEl)commEl.innerHTML=slCurPay!=='cash'&&cr>0?'<div style="font-size:11px;background:var(--bg);border-radius:10px;padding:4px 9px;margin-bottom:3px;color:var(--tx2);font-weight:700">Комиссия '+PL[slCurPay]+' '+cr+'% = <b style="color:var(--re)">'+fm(comm)+'</b></div>':'';
  const sc=document.getElementById('sl-calc');if(!sc)return;
  if(!qty||!price){sc.innerHTML='';return;}
  if(p&&qty>p.qty-p.sold){sc.innerHTML='<div style="color:var(--re);font-size:13px;font-weight:800;padding:5px 0">⚠ Недостаточно! Доступно: '+(p.qty-p.sold)+'шт</div>';return;}
  const mc=profit/total*100>=30?'var(--gr)':profit/total*100>=10?'var(--ye)':'var(--re)';
  sc.innerHTML='<div style="background:linear-gradient(135deg,var(--pu3),var(--gr3));border-radius:16px;padding:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:6px 0"><div style="text-align:center"><div style="font-size:10px;color:var(--tx2);font-weight:700">К оплате</div><div style="font-size:18px;font-weight:900;color:var(--pu)">'+fm(total)+'</div></div><div style="text-align:center"><div style="font-size:10px;color:var(--tx2);font-weight:700">Прибыль</div><div style="font-size:18px;font-weight:900;color:'+mc+'">'+fm(profit)+'</div></div><div style="text-align:center"><div style="font-size:10px;color:var(--tx2);font-weight:700">Маржа</div><div style="font-size:18px;font-weight:900;color:'+mc+'">'+(total>0?(profit/total*100).toFixed(0):0)+'%</div></div></div>';
}

function doSale(){
  const d=od();const id=slProdId;
  const p=d.products.find(x=>x.id===id);if(!p)return alert('Нажмите на товар из списка выше');
  const qty=parseInt(document.getElementById('sl-q')?.value)||0;
  const price=parseFloat(document.getElementById('sl-p')?.value)||0;
  if(!qty||!price)return alert('Укажите количество и цену');
  if(qty>p.qty-p.sold)return alert('Недостаточно товара! Доступно: '+(p.qty-p.sold)+'шт');
  const ed=parseFloat(document.getElementById('sl-d')?.value)||0;
  const fp=price*(1-ed/100);const total=fp*qty;const cogs=p.cost*qty;
  const cr=commRate(slCurPay);const comm=total*cr/100;
  const seller=d.employees.find(e=>e.id===slCurSeller);
  p.sold=(p.sold||0)+qty;
  const now=new Date();
  const sale={id:gid(),prodId:p.id,prodName:p.name,prodPhoto:p.photo||'',qty,price:fp,ed,
    total,cogs,commission:comm,commRate:cr,profit:total-cogs-comm,pay:slCurPay,
    sellerId:seller?.id||null,sellerName:seller?.name||null,
    buyer:document.getElementById('sl-b')?.value||'',
    date:td(),time:now.getHours()+':'+String(now.getMinutes()).padStart(2,'0'),
    screen:'',no:'#'+String(d.sales.length+1).padStart(4,'0')};
  d.sales.unshift(sale);
  // Auto-save client
  if(sale.buyer&&sale.buyer.trim()){
    if(!d.clients)d.clients=[];
    var existing=d.clients.find(function(cl){return cl.name.toLowerCase()===sale.buyer.toLowerCase().trim()||cl.phone===sale.buyer.trim();});
    if(existing){
      existing.visits=(existing.visits||0)+1;
      existing.totalSpent=(existing.totalSpent||0)+sale.total;
      existing.lastVisit=sale.date;
      existing.lastProduct=sale.prodName;
    } else {
      var isPhone=sale.buyer.trim().replace(/[^0-9]/g,'').length>=7;
      d.clients.push({id:gid(),name:isPhone?'Клиент':sale.buyer.trim(),phone:isPhone?sale.buyer.trim():'',visits:1,totalSpent:sale.total,firstVisit:sale.date,lastVisit:sale.date,lastProduct:sale.prodName,note:''});
    }
  }
  sd(d);
  showSaleReceipt(sale);
  slProdId=0;
  rSale();
}
