function showSellerDetail(sellerId){
  var d=od(), t=td();
  var panel=document.getElementById('seller-detail');
  if(!panel)return;
  // Toggle
  if(panel.dataset.open===String(sellerId)){
    panel.style.display='none';panel.dataset.open='';panel.innerHTML='';
    return;
  }
  panel.dataset.open=String(sellerId);
  panel.style.display='block';
  var id=parseInt(sellerId);
  var emp=d.employees.find(function(e){return e.id===id;})||{name:String(sellerId),id:id,fix:0,pct:0};

  var allS=d.sales.filter(function(s){return s.sellerId===id;});
  var todayS=allS.filter(function(s){return s.date===t;});
  var weekS=allS.filter(function(s){
    var sd=new Date(s.date),nd=new Date();
    return (nd-sd)<=7*86400000;
  });
  var monthS=allS.filter(function(s){return s.date.slice(0,7)===t.slice(0,7);});

  var todayR=todayS.reduce(function(a,s){return a+s.total;},0);
  var weekR=weekS.reduce(function(a,s){return a+s.total;},0);
  var monthR=monthS.reduce(function(a,s){return a+s.total;},0);
  var allR=allS.reduce(function(a,s){return a+s.total;},0);
  var allP=allS.reduce(function(a,s){return a+s.profit;},0);
  var avgCheck=allS.length?allR/allS.length:0;

  // First/last sale times today
  var firstTime=todayS.length?todayS[todayS.length-1].time:'—';
  var lastTime=todayS.length?todayS[0].time:'—';

  // Tasks today
  var myTasks=d.tasks.filter(function(tk){return tk.empId===id&&tk.date===t;});
  var doneTasks=myTasks.filter(function(tk){return tk.done;}).length;

  // Salary
  var monthComm=monthR*emp.pct/100;
  var bfMonth=(d.bfLog||[]).filter(function(b){return b.empId===id&&b.date.slice(0,7)===t.slice(0,7);});
  var bonMonth=bfMonth.filter(function(b){return b.amt>0;}).reduce(function(a,b){return a+b.amt;},0);
  var finMonth=Math.abs(bfMonth.filter(function(b){return b.amt<0;}).reduce(function(a,b){return a+b.amt;},0));
  var totalSalary=(emp.fix||0)+monthComm+bonMonth-finMonth;

  // Hourly chart (today)
  var hours={};
  todayS.forEach(function(s){
    var h=s.time?parseInt(s.time.split(':')[0]):0;
    if(!hours[h])hours[h]=0;
    hours[h]+=s.total;
  });
  var maxH=Math.max.apply(null,Object.values(hours).concat([1]));
  var hourChart='';
  for(var h2=8;h2<=21;h2++){
    var v=hours[h2]||0;
    var pct=Math.round(v/maxH*100);
    hourChart+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px" title="'+h2+':00 — '+fm(v)+'">';
    hourChart+='<div style="width:100%;border-radius:3px 3px 0 0;background:'+(v>0?'var(--pu)':'var(--bg)')+';height:'+Math.max(pct,v>0?4:0)+'%"></div>';
    hourChart+='<div style="font-size:9px;color:var(--tx3);font-weight:700">'+h2+'</div>';
    hourChart+='</div>';
  }

  var EC=['#7C6FE0','#E8544A','#3CC88A','#F5A623','#378ADD','#E91E8C','#00BCD4','#FF5722'];
  var empIdx=d.employees.findIndex(function(e){return e.id===id;});
  var empColor=EC[(empIdx>=0?empIdx:0)%8];

  var h='<div style="background:var(--card);border-radius:20px;padding:16px;margin-bottom:10px;border:2px solid '+empColor+'">';
  // Header
  h+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">';
  h+='<div style="width:52px;height:52px;border-radius:50%;background:'+empColor+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;flex-shrink:0">'+ini(emp.name)+'</div>';
  h+='<div style="flex:1"><div style="font-size:18px;font-weight:900;color:var(--tx)">'+emp.name+'</div>';
  h+='<div style="font-size:12px;color:var(--tx2);font-weight:700;margin-top:2px">'+(emp.role||'Сотрудник')+' · Оклад: '+fm(emp.fix||0)+' · % продаж: '+(emp.pct||0)+'%</div></div>';
  h+='<button data-sid="'+sellerId+'" onclick="showSellerDetail(this.dataset.sid)" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--tx3)">×</button>';
  h+='</div>';

  // KPI 4-grid
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">';
  var kpis=[
    {label:'Продаж сегодня', val:todayS.length+' шт', sub:fm(todayR), bg:'var(--gr3)', cl:'var(--gr2)'},
    {label:'За неделю', val:weekS.length+' шт', sub:fm(weekR), bg:'var(--bl3)', cl:'var(--bl2)'},
    {label:'За месяц', val:monthS.length+' шт', sub:fm(monthR), bg:'var(--pu3)', cl:'var(--pu2)'},
    {label:'Всего продаж', val:allS.length+' шт', sub:fm(allR), bg:'var(--ye3)', cl:'var(--ye2)'},
  ];
  kpis.forEach(function(k){
    h+='<div style="background:'+k.bg+';border-radius:14px;padding:10px 12px">';
    h+='<div style="font-size:11px;font-weight:800;color:'+k.cl+'">'+k.label+'</div>';
    h+='<div style="font-size:17px;font-weight:900;color:'+k.cl+';margin-top:2px">'+k.val+'</div>';
    h+='<div style="font-size:12px;font-weight:700;color:'+k.cl+'">'+k.sub+'</div>';
    h+='</div>';
  });
  h+='</div>';

  // Activity row
  h+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px">';
  h+='<div style="background:var(--bg);border-radius:12px;padding:8px;text-align:center"><div style="font-size:10px;color:var(--tx2);font-weight:700">Пришёл</div><div style="font-size:14px;font-weight:900;color:var(--bl)">'+firstTime+'</div></div>';
  h+='<div style="background:var(--bg);border-radius:12px;padding:8px;text-align:center"><div style="font-size:10px;color:var(--tx2);font-weight:700">Посл. продажа</div><div style="font-size:14px;font-weight:900;color:var(--gr)">'+lastTime+'</div></div>';
  h+='<div style="background:var(--bg);border-radius:12px;padding:8px;text-align:center"><div style="font-size:10px;color:var(--tx2);font-weight:700">Задачи</div><div style="font-size:14px;font-weight:900;color:'+(doneTasks===myTasks.length&&myTasks.length>0?'var(--gr)':'var(--ye)')+'">'+doneTasks+'/'+myTasks.length+'</div></div>';
  h+='<div style="background:var(--bg);border-radius:12px;padding:8px;text-align:center"><div style="font-size:10px;color:var(--tx2);font-weight:700">Ср. чек</div><div style="font-size:14px;font-weight:900;color:var(--pu)">'+fm(avgCheck)+'</div></div>';
  h+='</div>';

  // Hourly chart
  if(todayS.length){
    h+='<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:900;color:var(--tx);margin-bottom:6px">📊 Активность по часам (сегодня)</div>';
    h+='<div style="display:flex;align-items:flex-end;gap:3px;height:50px">'+hourChart+'</div></div>';
  }

  // Salary this month
  h+='<div style="background:var(--gr3);border-radius:14px;padding:12px;margin-bottom:12px">';
  h+='<div style="font-size:12px;font-weight:900;color:var(--gr2);margin-bottom:8px">💵 Зарплата (текущий месяц)</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">';
  h+='<div style="background:rgba(255,255,255,.7);border-radius:10px;padding:7px;text-align:center"><div style="font-size:10px;color:var(--tx2);font-weight:700">Оклад</div><div style="font-size:13px;font-weight:900">'+fm(emp.fix||0)+'</div></div>';
  h+='<div style="background:rgba(255,255,255,.7);border-radius:10px;padding:7px;text-align:center"><div style="font-size:10px;color:var(--tx2);font-weight:700">% продаж</div><div style="font-size:13px;font-weight:900;color:var(--bl)">'+fm(monthComm)+'</div></div>';
  h+='<div style="background:rgba(255,255,255,.7);border-radius:10px;padding:7px;text-align:center"><div style="font-size:10px;color:var(--tx2);font-weight:700">Бонусы</div><div style="font-size:13px;font-weight:900;color:var(--gr)">+'+fm(bonMonth)+'</div></div>';

  h+='</div>';
  if(finMonth>0)h+='<div style="font-size:12px;font-weight:700;color:var(--re);margin-top:6px">Штрафы: -'+fm(finMonth)+'</div>';

    myTasks.forEach(function(tk){
      h+='<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:'+(tk.done?'var(--gr3)':'var(--bg)')+';border-radius:10px;margin-bottom:5px">';

      if(tk.bonus>0)h+='<span class="badge bdg-gr" style="font-size:10px">+'+fm(tk.bonus)+'</span>';
      h+='</div>';
    });
  }

  // Today sales list

function calcBEHtml(d){
  var fixedCosts=(d.cfg.rent||0)+(d.cfg.util||0)+(d.cfg.ads||0)+(d.cfg.pen||0)
    +d.employees.reduce(function(a,e){return a+(e.fix||0);},0)
    +(d.customExp||[]).reduce(function(a,e){return a+e.amt;},0);
  var avgP=d.sales.length?d.sales.reduce(function(a,s){return a+s.price;},0)/d.sales.length:0;
  var avgC=d.sales.length?d.sales.reduce(function(a,s){return a+s.cogs/Math.max(s.qty,1);},0)/d.sales.length:0;
  if(!avgP||!avgC||avgP<=avgC)return'<div style="font-size:12px;color:var(--tx3);font-weight:700">Добавьте товары и продажи, укажите постоянные расходы выше.</div>';
  var margin=avgP-avgC;
  var beU=Math.ceil(fixedCosts/margin);
  var beR=beU*avgP;
  var rev=d.sales.reduce(function(a,s){return a+s.total;},0);
  var cov=beR>0?Math.min(rev/beR*100,100):0;
  var h='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">';
  h+='<div style="background:var(--bl3);border-radius:14px;padding:12px"><div style="font-size:11px;color:var(--bl2);font-weight:800">Нужно продать (шт)</div><div style="font-size:20px;font-weight:900;color:var(--bl)">'+beU.toLocaleString('ru-RU')+'</div></div>';
  h+='<div style="background:var(--bl3);border-radius:14px;padding:12px"><div style="font-size:11px;color:var(--bl2);font-weight:800">Мин. выручка</div><div style="font-size:20px;font-weight:900;color:var(--bl)">'+fm(beR)+'</div></div>';
  h+='<div style="background:var(--gr3);border-radius:14px;padding:12px"><div style="font-size:11px;color:var(--gr2);font-weight:800">Маржа за ед.</div><div style="font-size:20px;font-weight:900;color:var(--gr)">'+fm(margin)+'</div></div>';
  h+='<div style="background:var(--ye3);border-radius:14px;padding:12px"><div style="font-size:11px;color:var(--ye2);font-weight:800">Постоянные расходы</div><div style="font-size:20px;font-weight:900;color:var(--ye)">'+fm(fixedCosts)+'</div></div>';
  h+='</div>';
  h+='<div style="font-size:12px;font-weight:800;color:var(--tx2);margin-bottom:6px">Покрытие точки безубыточности</div>';
  h+='<div style="background:var(--bg);border-radius:12px;padding:10px">';
  h+='<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12px;font-weight:700;color:var(--tx2)">Текущая выручка</span><span style="font-size:13px;font-weight:900;color:'+(cov>=100?'var(--gr)':'var(--ye)')+'">'+cov.toFixed(0)+'%</span></div>';
  h+='<div style="background:var(--bg);border-radius:6px;height:10px;overflow:hidden;margin-bottom:6px"><div style="height:100%;border-radius:6px;background:'+(cov>=100?'var(--gr)':'var(--ye)')+';width:'+cov.toFixed(0)+'%"></div></div>';
  h+='<div style="font-size:11px;color:var(--tx2);font-weight:700">'+(cov>=100?'✅ ТБ пройдена! Прибыль: '+fm(rev-beR):'⚠ До ТБ осталось: '+fm(beR-rev))+'</div>';
  h+='</div>';
  return h;
}

// ===== BUSINESS PLAN =====
function rPlan(){
  var d=od(), w=document.getElementById('w-plan');if(!w)return;
  var period=window._planMonths||12;

  // Base metrics from real data
  var avgMonthRev=0, avgMonthProfit=0, avgMonthSales=0;
  if(d.sales.length){
    var byMonth={};
    d.sales.forEach(function(s){
      var m=s.date.slice(0,7);
      if(!byMonth[m])byMonth[m]={rev:0,profit:0,cnt:0};
      byMonth[m].rev+=s.total;byMonth[m].profit+=s.profit;byMonth[m].cnt++;
    });
    var months=Object.values(byMonth);
    if(months.length){
      avgMonthRev=months.reduce(function(a,m){return a+m.rev;},0)/months.length;
      avgMonthProfit=months.reduce(function(a,m){return a+m.profit;},0)/months.length;
      avgMonthSales=months.reduce(function(a,m){return a+m.cnt;},0)/months.length;
    }
  }

  // Fixed costs per month
  var salFix=d.employees.reduce(function(a,e){return a+(e.fix||0);},0);
  var fixedM=(d.cfg.rent||0)+(d.cfg.util||0)+(d.cfg.ads||0)+(d.cfg.pen||0)+salFix+(d.customExp||[]).reduce(function(a,e){return a+e.amt;},0);

  // Investments
  var totalInvest=(d.investments||[]).reduce(function(a,x){return a+x.amt;},0);

  // Growth rate input (default 5% per month)
  var growth=window._planGrowth||5;

  // Calculate monthly projections
  var months=[];
  var cumProfit=0;
  var breakevenMonth=null;
  for(var i=1;i<=period;i++){
    var growthFactor=Math.pow(1+growth/100,i-1);
    var mRev=Math.max(avgMonthRev,fixedM*1.5)*growthFactor;
    var mProfit=mRev*(avgMonthProfit/(avgMonthRev||1)||0.2)*growthFactor;
    if(mProfit<0||!avgMonthRev)mProfit=(mRev-fixedM)*0.5;
    var mNet=mProfit-fixedM;
    cumProfit+=mNet;
    if(!breakevenMonth&&totalInvest>0&&cumProfit>=totalInvest)breakevenMonth=i;
    months.push({n:i,rev:Math.round(mRev),profit:Math.round(mProfit),net:Math.round(mNet),cum:Math.round(cumProfit)});
  }

  // Key milestones
  var profitMonths=months.filter(function(m){return m.net>0;});
  var firstProfit=profitMonths.length?profitMonths[0].n:null;
  var totalRevPlan=months.reduce(function(a,m){return a+m.rev;},0);
  var totalProfitPlan=months.reduce(function(a,m){return a+m.net;},0);
  var avgMonthRevPlan=totalRevPlan/period;

  var h='';

  // Period tabs
  h+='<div style="display:flex;gap:8px;margin-bottom:16px;background:var(--card);border-radius:14px;padding:5px">';
  [{k:6,l:'6 мес'},{k:12,l:'1 год'},{k:24,l:'2 года'},{k:36,l:'3 года'}].forEach(function(p){
    h+='<button data-months="'+p.k+'" onclick="setPlanPeriod(this)" style="flex:1;padding:9px;border-radius:10px;border:none;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;';
    h+=period===p.k?'background:var(--pu);color:#fff':'background:transparent;color:var(--tx2)';
    h+='">'+p.l+'</button>';
  });
  h+='</div>';

  // Growth rate setting
  h+='<div style="background:var(--card);border-radius:18px;padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">';
  h+='<div style="font-size:13px;font-weight:800;color:var(--tx2)">Рост в месяц:</div>';
  h+='<div style="display:flex;gap:6px">';
  [0,3,5,10,15,20].forEach(function(g){
    h+='<button data-growth="'+g+'" onclick="setPlanGrowth(this)" style="padding:6px 12px;border-radius:10px;border:1.5px solid var(--br);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;';
    h+=growth===g?'background:var(--pu);color:#fff;border-color:var(--pu)':'background:#fff;color:var(--tx2)';
    h+='">'+g+'%</button>';
  });
  h+='</div>';
  h+='<div style="font-size:12px;color:var(--tx3);font-weight:600">Прогноз на основе ваших данных</div>';
  h+='</div>';

  // Key results
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px">';
  var kpis=[
    {l:'Выручка за '+period+'мес',v:fm(totalRevPlan),cl:'var(--pu2)',bg:'var(--pu3)'},
    {l:'Чистая прибыль',v:fm(totalProfitPlan),cl:totalProfitPlan>=0?'var(--gr2)':'var(--re2)',bg:totalProfitPlan>=0?'var(--gr3)':'var(--re3)'},
    {l:'Ср. выручка/мес',v:fm(Math.round(avgMonthRevPlan)),cl:'var(--bl2)',bg:'var(--bl3)'},
    {l:'Постоянные расходы',v:fm(fixedM)+'/мес',cl:'var(--re2)',bg:'var(--re3)'},
    {l:firstProfit?'Выход в прибыль':'Выход в прибыль',v:firstProfit?'Месяц '+firstProfit:'Нет данных',cl:'var(--ye2)',bg:'var(--ye3)'},
    {l:breakevenMonth?'Окупаемость':'Окупаемость',v:breakevenMonth?'Месяц '+breakevenMonth:(totalInvest?'> '+period+' мес':'Нет вложений'),cl:breakevenMonth?'var(--gr2)':'var(--tx2)',bg:breakevenMonth?'var(--gr3)':'var(--bg)'},
  ];
  kpis.forEach(function(k){
    h+='<div style="background:'+k.bg+';border-radius:14px;padding:12px">';
    h+='<div style="font-size:10px;font-weight:700;color:'+k.cl+';opacity:.8;margin-bottom:4px">'+k.l+'</div>';
    h+='<div style="font-size:16px;font-weight:900;color:'+k.cl+'">'+k.v+'</div>';
    h+='</div>';
  });
  h+='</div>';

  // Breakeven chart
  if(totalInvest>0){
    h+='<div style="background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px">';
    h+='<div style="font-size:14px;font-weight:900;color:var(--tx);margin-bottom:4px">⚖️ Точка безубыточности инвестиций</div>';

// ===== BACKUP / RESTORE =====
function exportBackup(){
  try {
    var data = JSON.stringify(DB, null, 2);
    var blob = new Blob([data], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var now = new Date();
    var dateStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    var orgName = DB.orgs.length ? DB.orgs[0].name.replace(/[^a-zA-Zа-яА-Я0-9]/g,'_') : 'backup';
    a.href = url;
    a.download = 'bizmanager_'+orgName+'_'+dateStr+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    try{localStorage.setItem('biz_last_backup',new Date().toISOString());}catch(e){}
    var msg = document.getElementById('backup-msg');
    if(msg){msg.style.color='var(--gr2)';msg.textContent='✅ Резервная копия скачана! Сохраните файл в надёжное место.';}
  } catch(e) {
    alert('Ошибка при экспорте: '+e.message);
  }
}

function importBackup(input){
  var file=input.files[0];
  if(!file)return;
  var msg=document.getElementById('backup-msg');
  if(msg){msg.style.color='var(--bl2)';msg.textContent='Загружаю данные...';}
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data.orgs||!Array.isArray(data.orgs))throw new Error('Неверный формат файла');
      if(data.orgs.length===0)throw new Error('В файле нет организаций');
      var orgNames=data.orgs.map(function(o){return o.name;}).join(', ');
      var totalSales=data.orgs.reduce(function(a,o){return a+(data[o.id]&&data[o.id].sales?data[o.id].sales.length:0);},0);
      var confirmMsg='Загрузить данные? Организаций: '+data.orgs.length+', Магазины: '+orgNames+', Продаж: '+totalSales+'. ТЕКУЩИЕ ДАННЫЕ БУДУТ ЗАМЕНЕНЫ!';
      if(!confirm(confirmMsg)){input.value='';if(msg){msg.style.color='var(--tx3)';msg.textContent='Загрузка отменена.';}return;}
      DB=data;save();
      if(msg){msg.style.color='var(--gr2)';msg.textContent='✅ Данные восстановлены! '+data.orgs.length+' организаций загружено.';}
      setTimeout(function(){renderOrgList();showScreen('s-orgs');alert('✅ Данные восстановлены! Выберите организацию для входа.');},500);
    }catch(err){
      if(msg){msg.style.color='var(--re2)';msg.textContent='Ошибка: '+err.message;}
      alert('Ошибка загрузки: '+err.message);
    }
    input.value='';
  };
  reader.onerror=function(){if(msg){msg.style.color='var(--re2)';msg.textContent='Не удалось прочитать файл.';}};
  reader.readAsText(file);
}

}

// ===== PLAN =====
function rPlan(){
  var d=od();
  var w=document.getElementById('w-plan');if(!w)return;
  var period=window._planPeriod||12;

  // Historical data for projections
  var allSales=d.sales;
  var allRev=allSales.reduce(function(a,s){return a+s.total;},0);
  var allProfit=allSales.reduce(function(a,s){return a+s.profit;},0);

  // Group by month
  var byMonth={};
  allSales.forEach(function(s){
    var m=s.date.slice(0,7);
    if(!byMonth[m])byMonth[m]={rev:0,profit:0,cnt:0};
    byMonth[m].rev+=s.total;byMonth[m].profit+=s.profit;byMonth[m].cnt++;
  });
  var months=Object.keys(byMonth).sort();
  var monthCount=Math.max(months.length,1);
  var avgMonthRev=allRev/monthCount;
  var avgMonthProfit=allProfit/monthCount;

  // Fixed costs
  var salFix=d.employees.reduce(function(a,e){return a+(e.fix||0);},0);
  var fixedM=(d.cfg.rent||0)+(d.cfg.util||0)+(d.cfg.ads||0)+(d.cfg.pen||0)+salFix+(d.customExp||[]).reduce(function(a,e){return a+e.amt;},0);
  var totalInvest=(d.investments||[]).reduce(function(a,x){return a+x.amt;},0);

  // Growth scenarios
  var scenarios=[
    {name:'Консервативный',color:'var(--bl)',growth:0.03},
    {name:'Умеренный',color:'var(--gr)',growth:0.07},
    {name:'Оптимистичный',color:'var(--ye)',growth:0.12},
  ];

  var h='';

  // Period tabs
  h+='<div style="display:flex;gap:8px;margin-bottom:16px;background:var(--card);border-radius:14px;padding:5px">';

    h+='<button data-period="'+p.k+'" onclick="setPlanPeriod(this.dataset.period)" style="flex:1;padding:9px;border-radius:10px;border:none;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;';
    h+=period===p.k?'background:var(--pu);color:#fff':'background:transparent;color:var(--tx2)';
    h+='">'+p.l+'</button>';
  });
  h+='</div>';

  // Base indicators
  h+='<div style="background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px">';
  h+='<div style="font-size:13px;font-weight:800;color:var(--tx2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.4px">Базовые показатели (средние)</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px">';
  [{l:'Ср. выручка/мес',v:fm(avgMonthRev),bg:'var(--pu3)',cl:'var(--pu2)'},
   {l:'Ср. прибыль/мес',v:fm(avgMonthProfit),bg:'var(--gr3)',cl:'var(--gr2)'},
   {l:'Постоянные расходы',v:fm(fixedM),bg:'var(--re3)',cl:'var(--re2)'},
   {l:'Вложения',v:fm(totalInvest),bg:'var(--ye3)',cl:'var(--ye2)'},
  ].forEach(function(s){
    h+='<div style="background:'+s.bg+';border-radius:12px;padding:11px">';
    h+='<div style="font-size:10px;font-weight:700;color:'+s.cl+';opacity:.8">'+s.l+'</div>';
    h+='<div style="font-size:16px;font-weight:900;color:'+s.cl+';margin-top:4px">'+s.v+'</div>';
    h+='</div>';
  });
  h+='</div></div>';

  // Scenarios table
  h+='<div style="background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px">';
  h+='<div style="font-size:14px;font-weight:900;color:var(--tx);margin-bottom:14px">📊 Прогноз на '+period+' месяцев</div>';
  h+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">';
  h+='<thead><tr style="background:var(--bg)">';
  h+='<th style="padding:9px 10px;text-align:left;font-weight:900">Сценарий</th>';
  h+='<th style="padding:9px 8px;text-align:right;font-weight:900;color:var(--pu)">Выручка</th>';
  h+='<th style="padding:9px 8px;text-align:right;font-weight:900;color:var(--gr)">Прибыль</th>';
  h+='<th style="padding:9px 8px;text-align:right;font-weight:900;color:var(--bl)">Расходы</th>';
  h+='<th style="padding:9px 8px;text-align:right;font-weight:900;color:var(--ye2)">Окупаемость</th>';
  h+='</tr></thead><tbody>';
  scenarios.forEach(function(sc,si){
    var totRev=0,totProfit=0,totExp=fixedM*period;
    var recovered=0,recMonth=null;
    for(var m=1;m<=period;m++){
      var mRev=avgMonthRev*Math.pow(1+sc.growth,m-1);
      var mProfit=avgMonthProfit*Math.pow(1+sc.growth,m-1);
      totRev+=mRev;totProfit+=mProfit;
      if(totalInvest>0&&recMonth===null){
        recovered+=mProfit-fixedM;
        if(recovered>=totalInvest)recMonth=m;
      }
    }
    var netProfit=totProfit-totExp;
    h+='<tr style="border-bottom:1px solid var(--br)">';
    h+='<td style="padding:10px 10px"><div style="display:flex;align-items:center;gap:8px"><div style="width:10px;height:10px;border-radius:50%;background:'+sc.color+';flex-shrink:0"></div><div><div style="font-weight:800">'+sc.name+'</div><div style="font-size:10px;color:var(--tx3)">+'+Math.round(sc.growth*100)+'%/мес рост</div></div></div></td>';
    h+='<td style="padding:10px 8px;text-align:right;font-weight:800;color:var(--pu)">'+fm(totRev)+'</td>';
    h+='<td style="padding:10px 8px;text-align:right;font-weight:800;color:'+(netProfit>=0?'var(--gr)':'var(--re)')+'">'+fm(netProfit)+'</td>';
    h+='<td style="padding:10px 8px;text-align:right;font-weight:700;color:var(--tx2)">'+fm(totExp)+'</td>';
    h+='<td style="padding:10px 8px;text-align:right;font-weight:900;color:'+(recMonth?'var(--gr)':'var(--re)')+'">'+( recMonth?recMonth+' мес':totalInvest>0?'> '+period+' мес':'-')+'</td>';
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';

  // Monthly breakdown chart for moderate scenario
  h+='<div style="background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px">';
  h+='<div style="font-size:14px;font-weight:900;color:var(--tx);margin-bottom:4px">📈 Помесячный прогноз (умеренный)</div>';
  h+='<div style="font-size:12px;color:var(--tx2);font-weight:600;margin-bottom:12px">Накопительная прибыль и точка безубыточности</div>';
  var growth=0.07;
  var cumProfit=0,beMonth=null,invRecMonth=null;
  var monthData=[];
  for(var m=1;m<=period;m++){
    var mRev2=avgMonthRev*Math.pow(1+growth,m-1);
    var mProfit2=avgMonthProfit*Math.pow(1+growth,m-1)-fixedM;
    cumProfit+=mProfit2;
    if(beMonth===null&&mProfit2>0)beMonth=m;
    if(totalInvest>0&&invRecMonth===null&&cumProfit>=totalInvest)invRecMonth=m;
    monthData.push({m:m,rev:mRev2,profit:mProfit2,cum:cumProfit});
  }
  var maxCum=Math.max.apply(null,monthData.map(function(x){return Math.abs(x.cum);}));

  h+='<div style="display:flex;align-items:flex-end;gap:3px;height:'+chartH+'px;position:relative;margin-bottom:20px">';
  // Zero line
  var zeroY=maxCum>0?Math.min(chartH,Math.round((maxCum/(maxCum+Math.max(0,-monthData[0].cum||0)))*chartH)):chartH/2;
  monthData.forEach(function(x){
    var pct=maxCum>0?Math.min(Math.abs(x.cum)/maxCum,1):0;
    var barH=Math.round(pct*chartH*0.9);
    var isPos=x.cum>=0;
    var isRec=(invRecMonth&&x.m===invRecMonth);
    var isBE=(beMonth&&x.m===beMonth);
    h+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative" title="М'+x.m+': '+fm(x.cum)+'">';
    if(isPos){
      h+='<div style="height:'+(chartH-barH)+'px"></div>';
      h+='<div style="width:100%;height:'+barH+'px;border-radius:3px 3px 0 0;background:'+(isRec?'var(--ye)':isBE?'var(--gr)':'var(--pu)')+';transition:all .3s"></div>';
    } else {
      h+='<div style="width:100%;height:'+barH+'px;border-radius:0 0 3px 3px;background:var(--re);margin-top:'+(chartH-barH)+'px"></div>';
    }
    h+='<div style="font-size:9px;font-weight:700;color:var(--tx3);position:absolute;bottom:-16px">'+x.m+'</div>';
    h+='</div>';
  });
  h+='</div>';
  // Legend
  h+='<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">';
  h+='<div style="display:flex;align-items:center;gap:5px"><div style="width:12px;height:12px;border-radius:3px;background:var(--pu)"></div><span style="font-size:11px;font-weight:700;color:var(--tx2)">Накоп. прибыль</span></div>';
  if(beMonth)h+='<div style="display:flex;align-items:center;gap:5px"><div style="width:12px;height:12px;border-radius:3px;background:var(--gr)"></div><span style="font-size:11px;font-weight:700;color:var(--gr2)">Точка безубыточности: мес. '+beMonth+'</span></div>';
  if(invRecMonth)h+='<div style="display:flex;align-items:center;gap:5px"><div style="width:12px;height:12px;border-radius:3px;background:var(--ye)"></div><span style="font-size:11px;font-weight:700;color:var(--ye2)">Окупаемость вложений: мес. '+invRecMonth+'</span></div>';

  // Breakeven + payback summary
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">';

  h+='<div style="font-size:11px;color:var(--tx2);font-weight:700">Выручка для покрытия расходов</div>';
  h+='<div style="font-size:22px;font-weight:900;color:var(--bl);margin:6px 0">'+fm(beRev)+'<span style="font-size:12px">/мес</span></div>';
  h+=fixedM>0?'<div style="font-size:11px;color:var(--bl2);font-weight:700">Постоянные расходы: '+fm(fixedM)+'</div>':'<div style="font-size:11px;color:var(--tx3)">Укажите расходы в Финансах</div>';
  h+='</div>';

  h+='<div style="background:var(--ye3);border-radius:18px;padding:16px">';

function rCash(){

  var todayIn=d.sales.filter(function(s){return s.date===t;}).reduce(function(a,s){return a+s.total;},0);
  var todayOut=d.cashbook.filter(function(x){return x.type==='out'&&x.date===t;}).reduce(function(a,x){return a+x.amt;},0);
  var todayWd=d.withdrawals.filter(function(x){return x.date===t;}).reduce(function(a,x){return a+x.amt;},0);
  var h='';

  h+='<button class="btn btn-re" onclick="addCBOut()" style="width:100%;margin-top:4px">− Добавить расход</button></div>';

  }

  h+='<div class="row"><label>Сумма</label><input class="inp" type="number" id="wd-a" placeholder="0"><span class="u">сум</span></div>';

  h+='<div class="card"><div class="ct">История</div>';

  d.cashbook.filter(function(x){return x.type==='out';}).forEach(function(x){all.push({date:x.date,time:'',label:x.desc,amt:-x.amt,type:'out',pay:''});});
  d.withdrawals.forEach(function(x){all.push({date:x.date,time:'',label:'Изъято'+(x.who?' ('+x.who+')':''),amt:-x.amt,type:'wd',pay:''});});

// ===== DAILY =====
function rDaily(){
  var d=od(), w=document.getElementById('w-daily');if(!w)return;
  var byDay={};
  d.sales.forEach(function(s){
    if(!byDay[s.date])byDay[s.date]={rev:0,profit:0,cnt:0,sales:[]};
    byDay[s.date].rev+=s.total;byDay[s.date].profit+=s.profit;byDay[s.date].cnt++;
    byDay[s.date].sales.push(s);
  });
  var days=Object.keys(byDay).sort(function(a,b){return b>a?1:-1;});
  var h='';
  // Total summary
  var totalRev=d.sales.reduce(function(a,s){return a+s.total;},0);
  var totalP=d.sales.reduce(function(a,s){return a+s.profit;},0);
  h+='<div class="mstrip">';
  h+='<div class="mc bl"><div class="ml">Дней с продажами</div><div class="mv">'+days.length+'</div></div>';
  h+='<div class="mc gr"><div class="ml">Общая выручка</div><div class="mv">'+fm(totalRev)+'</div></div>';
  h+='<div class="mc pu"><div class="ml">Общая прибыль</div><div class="mv">'+fm(totalP)+'</div></div>';
  h+='<div class="mc ye"><div class="ml">Ср. выручка/день</div><div class="mv">'+fm(days.length?totalRev/days.length:0)+'</div></div>';
  h+='</div>';
  h+='<div class="card">';
  h+='<div class="ct">Продажи по дням</div>';
  if(!days.length){
    h+='<div class="empty">Нет продаж</div>';
  } else {
    days.forEach(function(day){
      var x=byDay[day];
      var isToday=day===td();
      h+='<div style="border:1.5px solid '+(isToday?'var(--pu)':'var(--br)')+';border-radius:14px;padding:12px;margin-bottom:8px;background:'+(isToday?'var(--pu3)':'var(--card)')+'">';
      // Header row
      h+='<div style="display:flex;align-items:center;gap:10px">';
      h+='<div style="flex:1">';
      h+='<div style="font-weight:900;font-size:14px;color:'+(isToday?'var(--pu)':'var(--tx)')+'">'+day+(isToday?' (сегодня)':'')+'</div>';
      h+='<div style="font-size:11px;color:var(--tx3);font-weight:700">'+x.cnt+' продаж</div>';
      h+='</div>';
      h+='<div style="text-align:right">';
      h+='<div style="font-weight:900;color:var(--gr);font-size:15px">'+fm(x.rev)+'</div>';
      h+='<div style="font-size:11px;color:var(--tx2);font-weight:700">'+fm(x.profit)+' прибыль</div>';
      h+='</div>';
      // Delete day button (director only)
      if(curRole==='dir'){
        h+='<button data-day="'+day+'" onclick="deleteDaySales(this)" style="background:var(--re3);border:1.5px solid var(--re);border-radius:10px;padding:6px 10px;font-size:11px;font-weight:800;color:var(--re);cursor:pointer;flex-shrink:0;margin-left:6px">🗑 Удалить день</button>';
      }
      h+='</div>';
      // Sales list toggle
      h+='<div style="margin-top:8px">';
      h+='<button data-day="'+day+'" onclick="toggleDaySales(this)" style="background:var(--bg);border:1.5px solid var(--br);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:800;color:var(--tx2);cursor:pointer;width:100%">▼ Показать '+x.cnt+' продаж</button>';
      h+='<div id="day-sales-'+day+'" style="display:none;margin-top:8px">';
      x.sales.forEach(function(s){
        h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--br);font-size:12px">';
        h+='<div><span style="font-weight:800">'+s.prodName+'</span>';
        h+=' <span class="badge bdg-'+s.pay+'">'+PL[s.pay]+'</span>';
        h+='<div style="font-size:10px;color:var(--tx3)">'+s.time+' · '+s.qty+' шт'+(s.sellerName?' · '+s.sellerName:'')+'</div></div>';
        h+='<div style="display:flex;align-items:center;gap:6px">';
        h+='<div style="text-align:right"><div style="font-weight:900;color:var(--gr)">'+fm(s.total)+'</div></div>';
        h+='<button data-sid="'+s.id+'" onclick="deleteSingleSale(this)" style="background:var(--re3);border:none;border-radius:6px;padding:3px 7px;font-size:11px;font-weight:800;color:var(--re);cursor:pointer">×</button>';
        h+='</div></div>';
      });
      h+='</div></div>';
      h+='</div>';
    });
  }
  h+='</div>';
  w.innerHTML=h;
}

function toggleDaySales(btn){
  var day=btn.dataset.day;
  var el=document.getElementById('day-sales-'+day);
  if(!el)return;
  var shown=el.style.display!=='none';
  el.style.display=shown?'none':'block';
  btn.textContent=(shown?'▼ Показать ':'▲ Скрыть ')+btn.textContent.replace(/[▼▲] (Показать |Скрыть )/,'');
}

function deleteDaySales(btn){
  var day=btn.dataset.day;
  var d=od();
  var cnt=d.sales.filter(function(s){return s.date===day;}).length;
  if(!confirm('Удалить ВСЕ '+cnt+' продаж за '+day+'?\nЭто действие нельзя отменить!'))return;
  // Restore product quantities
  d.sales.filter(function(s){return s.date===day;}).forEach(function(s){
    var p=d.products.find(function(x){return x.id===s.prodId;});
    if(p)p.sold=Math.max(0,(p.sold||0)-s.qty);
  });
  d.sales=d.sales.filter(function(s){return s.date!==day;});
  sd(d);rDaily();
}

function deleteSingleSale(btn){
  var id=parseInt(btn.dataset.sid);
  if(!confirm('Удалить эту продажу?'))return;
  var d=od();
  var s=d.sales.find(function(x){return x.id===id;});
  if(s){var p=d.products.find(function(x){return x.id===s.prodId;});if(p)p.sold=Math.max(0,(p.sold||0)-s.qty);}
  d.sales=d.sales.filter(function(x){return x.id!==id;});
  sd(d);rDaily();
}

function toggleProdSel(cb){
  var pid=parseInt(cb.dataset.pid);
  if(cb.checked)selectedProds.add(pid);
  else selectedProds.delete(pid);
  // Update row styling without full re-render
  var row=document.getElementById('pc-row-'+pid);
  if(row){
    row.style.background=cb.checked?'var(--pu3)':'var(--card)';
    row.style.borderColor=cb.checked?'var(--pu)':'transparent';
  }
  // Update toolbar count
  var toolbar=document.querySelector('#prod-cards .sel-toolbar-count');
  rProdCards(); // re-render toolbar
}

function toggleSelectAllProds(cb){
  var d=od();
  if(cb.checked)d.products.forEach(function(p){selectedProds.add(p.id);});

}

  html+='.tunit{font-size:6pt;color:#333;font-weight:700;padding-bottom:1mm;margin-left:0.5mm}';
  html+='.tbars{display:flex;align-items:flex-end;height:5mm;gap:0.2mm;margin:0.5mm 0}';
  html+='.b{display:inline-block;background:#111}';

  html+='@media print{@page{margin:4mm;size:A4}body{padding:0}.no-print{display:none}}';
  html+='</style></head><body>';
  html+='<div class="no-print" style="padding:8px 12px;background:#1a3a8f;color:#fff;font-family:Arial;font-size:13px;display:flex;gap:10px;align-items:center">';

    var priceInt=Math.floor(p.salePrice||0);

    // Simple barcode bars
    var bars='';

    for(var i=0;i<pw.length;i++){
      if(i%2===0)bars+='<div class="b" style="width:'+pw[i]*0.3+'mm;height:'+(i%4===0?100:75)+'%"></div>';
      else bars+='<div style="width:'+pw[i]*0.2+'mm"></div>';

    html+='<div class="tcode">'+bc+'</div>';
    html+='<div class="tfoot"><span>'+today+'</span><span>за 1 шт.</span></div>';
    html+='</div>';

  return html;

function generateBarcode(id){
  return String(1000000+id).padStart(7,'0');
}


function updateCatList(){
  var d=od();
  var cats=[...new Set(d.products.map(function(p){return p.cat||'';}).filter(function(c){return c.trim();}))].sort();
  var dl=document.getElementById('cat-list');if(!dl)return;
  dl.innerHTML=cats.map(function(c){return'<option value="'+c+'">';}).join('');
}

function toggleRestock(btn){
  var pid=btn.dataset.pid;var el=document.getElementById('restock-'+pid);if(!el)return;
  var shown=el.style.display!=='none';el.style.display=shown?'none':'block';
  if(!shown){var qEl=document.getElementById('rst-qty-'+pid);if(qEl){qEl.value='';qEl.focus();}}
}

function doRestock(btn){
  var pid=parseInt(btn.dataset.pid);
  var qty=parseInt(document.getElementById('rst-qty-'+pid)?.value)||0;
  if(!qty||qty<=0)return alert('Укажите количество');
  var cost=parseFloat(document.getElementById('rst-cost-'+pid)?.value)||0;
  var price=parseFloat(document.getElementById('rst-price-'+pid)?.value)||0;
  var d=od();var p=d.products.find(function(x){return x.id===pid;});if(!p)return;
  p.qty+=qty;
  if(cost>0)p.cost=cost;
  if(price>0){p.price=price;p.salePrice=price*(1-(p.disc||0)/100);p.margin=p.salePrice>0?((p.salePrice-p.cost)/p.salePrice*100):0;}
  sd(d);
  var el=document.getElementById('restock-'+pid);
  if(el){el.innerHTML='<div style="text-align:center;padding:8px;color:var(--gr);font-weight:800">✅ Добавлено '+qty+' шт! Остаток: '+(p.qty-p.sold)+'шт</div>';setTimeout(function(){rStock();},1200);}
}

function delProd(btn){
  var pid=parseInt(btn.dataset.pid);
  if(!confirm('Удалить товар?'))return;
  var d=od();d.products=d.products.filter(function(x){return x.id!==pid;});sd(d);rStock();
}

ог ${d.cfg.tax}%</span><span class="sr" style="color:var(--re)">-${fm(tax)} (${pc(tax,rev)})</span></div>${soc>0?`<div class="srow"><span class="sl">Соц. ${d.cfg.soc}%</span><span class="sr" style="color:var(--re)">-${fm(soc)}</span></div>`:''}<div class="srow"><span class="sl">Пенсионный</span><span class="sr" style="color:var(--ye)">-${fm(d.cfg.pen)}</span></div><div class="srow"><span class="sl">Банк. комиссии</span><span class="sr" style="color:var(--bl)">-${fm(bk)}</span></div><div class="trow"><span>Итого обязательных</span><span style="color:var(--re)">-${fm(tot)} (${pc(tot,rev)})</span></div></div>`;}

function rDefects(){const d=od();const tot=d.defects.reduce((a,x)=>a+x.loss,0);const qty=d.defects.reduce((a,x)=>a+x.qty,0);const w=document.getElementById('w-defects');w.innerHTML=`<div class="g2c"><div class="card"><div class="ct">Записать брак</div><div class="row"><label>Товар</label><select class="inp" id="def-prod" onchange="onDefProd()"><option value="">— или вручную —</option>${d.products.filter(p=>p.qty-p.sold>0).map(p=>`<option value="${p.id}">${p.name} (${p.qty-p.sold}шт)</option>`).join('')}</select></div><div class="row"><label>Название</label><input class="inp" id="dn" placeholder="Название"></div><div class="row"><label>Количество</label><input class="inp" type="number" id="dq" placeholder="0"><span class="u">шт</span></div><div class="row"><label>Себестоимость (ед.)</label><input class="inp" type="number" id="dc" placeholder="0"><span class="u">сум</span></div><div class="row"><label>Причина</label><input class="inp" id="dr" placeholder="Причина"></div><div class="row"><label>Дата</label><input class="inp" type="date" id="ddt" value="${td()}"></div><button class="btn btn-re" onclick="addDef()" style="margin-top:4px">Списать брак</button></div><div class="card"><div class="ct">Убытки</div><div class="srow"><span class="sl">Записей</span><span class="sr">${d.defects.length}</span></div><div class="srow"><span class="sl">Списано единиц</span><span class="sr">${qty}шт</span></div><div class="trow"><span>Убыток</span><span style="color:var(--ye)">${fm(tot)}</span></div></div></div><div class="card"><div class="ct">Список брака</div><div id="def-list">${defListH()}</div></div>`;}

function autoTasks(){
  if(!curOrg||!DB[curOrg])return;
  var d=od(),t=td();
  d.taskTmpls.filter(function(tmpl){return tmpl.daily;}).forEach(function(tmpl){
    var targets=tmpl.empIds&&tmpl.empIds.length
      ? d.employees.filter(function(e){return tmpl.empIds.indexOf(e.id)>=0;})

      if(!d.tasks.find(function(tk){return tk.empId===emp.id&&tk.date===t&&tk.tmplId===tmpl.id;})){

      }
    });
  });
  sd(d);
}

function tmplListHTML(d){
  return d.taskTmpls.map(function(t){
    var empNames=t.empIds&&t.empIds.length
      ? t.empIds.map(function(id){var e=d.employees.find(function(x){return x.id===id;});return e?e.name:'?';}).join(', ')
      : 'Все сотрудники';
    return '<div style="background:var(--bg);border-radius:14px;padding:12px;margin-bottom:8px">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'
      +'<div style="flex:1">'
      +'<div style="font-size:13px;font-weight:800;color:var(--tx)">🔁 '+t.title+'</div>'
      +(t.desc?'<div style="font-size:11px;color:var(--tx2);font-weight:700;margin-top:2px">'+t.desc+'</div>':'')
      +'<div style="font-size:11px;color:var(--bl2);font-weight:700;margin-top:3px">👥 '+empNames+'</div>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px">'
      +(t.bonus>0?'<span class="badge bdg-gr">+'+fm(t.bonus)+' бонус</span>':'')
      +(t.fine>0?'<span class="badge bdg-re">-'+fm(t.fine)+' штраф</span>':'')
      +'</div></div>'
      +'<button class="del" data-tid="'+t.id+'" onclick="delTmpl(this)">×</button>'
      +'</div></div>';
  }).join('');
}

function toggleAddTmpl(){
  var f=document.getElementById('tmpl-form');
  if(f)f.style.display=f.style.display==='none'?'block':'none';
}

function tmplToggleAll(cb){
  document.querySelectorAll('.tmpl-emp-cb').forEach(function(el){el.checked=cb.checked;});
}

function addTmpl(){
  var d=od();
  var title=(document.getElementById('tmpl-title')?.value||'').trim();
  if(!title)return alert('Введите название задачи');
  var cbs=document.querySelectorAll('.tmpl-emp-cb:checked');
  var empIds=cbs.length?Array.from(cbs).map(function(cb){return parseInt(cb.value);}):[];
  var tmpl={
    id:gid(), title:title,
    desc:document.getElementById('tmpl-desc')?.value||'',
    bonus:parseFloat(document.getElementById('tmpl-bon')?.value)||0,
    fine:parseFloat(document.getElementById('tmpl-fin')?.value)||0,
    daily:true, empIds:empIds
  };
  if(!d.taskTmpls)d.taskTmpls=[];
  d.taskTmpls.push(tmpl);
  // Create today's tasks immediately
  var t=td();
  var targets=empIds.length?d.employees.filter(function(e){return empIds.indexOf(e.id)>=0;}):d.employees;
  targets.forEach(function(emp){
    if(!d.tasks.find(function(tk){return tk.empId===emp.id&&tk.date===t&&tk.tmplId===tmpl.id;})){
      d.tasks.push({id:gid(),tmplId:tmpl.id,title:tmpl.title,desc:tmpl.desc,
        empId:emp.id,empName:emp.name,date:t,
        bonus:tmpl.bonus,fine:tmpl.fine,done:false,doneTime:null});
    }
  });
  sd(d);rTasks();
}

function delTmpl(btn){
  var id=parseInt(btn.dataset.tid);
  var d=od();
  d.taskTmpls=d.taskTmpls.filter(function(x){return x.id!==id;});
  sd(d);rTasks();
}

function rTmplReport(){
  var d=od(),t=td();
  var el=document.getElementById('tmpl-report');if(!el)return;
  if(!d.taskTmpls.length){el.innerHTML='<div class="empty">Нет шаблонов</div>';return;}
  var h='';
  d.taskTmpls.forEach(function(tmpl){
    var todayTasks=d.tasks.filter(function(tk){return tk.tmplId===tmpl.id&&tk.date===t;});
    var done=todayTasks.filter(function(tk){return tk.done;}).length;
    var total=todayTasks.length;
    var pct=total>0?Math.round(done/total*100):0;
    h+='<div style="padding:8px 0;border-bottom:1px solid var(--br)">';
    h+='<div style="display:flex;justify-content:space-between;margin-bottom:4px">';
    h+='<span style="font-size:12px;font-weight:800;color:var(--tx)">'+tmpl.title+'</span>';
    h+='<span style="font-size:12px;font-weight:900;color:'+(pct===100?'var(--gr)':'var(--ye)')+'">'+done+'/'+total+' ('+pct+'%)</span>';
    h+='</div>';
    h+='<div style="background:var(--bg);border-radius:6px;height:6px;overflow:hidden">';
    h+='<div style="height:100%;border-radius:6px;background:'+(pct===100?'var(--gr)':'var(--pu)')+';width:'+pct+'%"></div></div>';
    h+='</div>';
  });
  el.innerHTML=h||'<div class="empty">Нет данных</div>';
}

function addTask(){const d=od();const empId=parseInt(document.getElementById('tk-emp')?.value);const title=document.getElementById('tk-title')?.value.trim();if(!empId||!title)return alert('Выберите сотрудника и введите задачу');const emp=d.employees.find(e=>e.id===empId);const bonus=parseFloat(document.getElementById('tk-bon')?.value)||0;const fine=parseFloat(document.getElementById('tk-fin')?.value)||0;const date=document.getElementById('tk-date')?.value||td();const daily=document.getElementById('tk-daily')?.value==='1';const task={id:gid(),tmplId:null,title,desc:document.getElementById('tk-desc')?.value||'',empId,empName:emp?.name||'',date,bonus,fine,done:false,doneTime:null};if(daily){d.taskTmpls.push({id:gid(),title,desc:document.getElementById('tk-desc')?.value||'',bonus,fine,daily:true});task.tmplId=d.taskTmpls[d.taskTmpls.length-1].id;}d.tasks.push(task);sd(d);['tk-title','tk-desc','tk-bon','tk-fin'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});rTasks();}
function addAnn(){const d=od();const t=document.getElementById('ann-t')?.value.trim();const b=document.getElementById('ann-b')?.value.trim();if(!t)return;d.announcements.unshift({id:gid(),title:t,body:b,date:td()});sd(d);document.getElementById('ann-t').value='';document.getElementById('ann-b').value='';rAnnList();}
function rAnnList(){const d=od();const el=document.getElementById('ann-list');if(!el)return;el.innerHTML=d.announcements.slice(0,3).map(a=>`<div class="ann-card"><div style="display:flex;justify-content:space-between"><div style="font-size:14px;font-weight:900">${a.title}</div><button class="del" style="color:rgba(255,255,255,.5)" onclick="const d=od();d.announcements=d.announcements.filter(x=>x.id!==${a.id});sd(d);rAnnList()">×</button></div>${a.body?`<div style="font-size:12px;color:rgba(255,255,255,.8);font-weight:700;margin-top:3px;line-height:1.5">${a.body}</div>`:''}<div style="font-size:10px;color:rgba(255,255,255,.5);margin-top:6px;font-weight:700">${a.date}</div></div>`).join('');}

// ===== BONUS APPROVAL =====
function dirApproveBonuses(){
  var d=od();
  if(!d.bonusRequests)d.bonusRequests=[];
  var pending=d.bonusRequests.filter(function(r){return r.status==='pending';});
  var panel=document.getElementById('bonus-requests-panel');
  if(!panel)return;
  if(!pending.length){panel.innerHTML='<div class="empty">Нет заявок на проверке</div>';return;}
  panel.innerHTML=pending.map(function(r){
    return '<div class="rw" style="flex-direction:column;align-items:stretch;gap:8px;padding:10px">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start">'
      +'<div><div style="font-weight:800;font-size:13px">'+r.empName+'</div>'
      +'<div style="font-size:12px;color:var(--tx2);font-weight:700;margin-top:2px">'+r.desc+'</div>'
      +'<div style="font-size:11px;color:var(--tx3);font-weight:600">'+r.date+' · '+r.doneTime+'</div></div>'
      +'<div style="font-size:16px;font-weight:900;color:var(--gr)">+'+fm(r.amt)+'</div>'
      +'</div>'
      +'<div style="display:flex;gap:8px">'
      +'<button class="btn btn-gr" data-rid="'+r.id+'" onclick="approveBonus(this)" style="flex:1;padding:8px;font-size:13px">✓ Одобрить</button>'
      +'<button class="btn btn-re" data-rid="'+r.id+'" onclick="rejectBonus(this)" style="flex:1;padding:8px;font-size:13px">✗ Отклонить</button>'
      +'</div></div>';
  }).join('');
}

function approveBonus(btn){
  var rid=parseInt(btn.dataset.rid);
  var d=od();
  if(!d.bonusRequests)return;
  var r=d.bonusRequests.find(function(x){return x.id===rid;});
  if(!r)return;
  r.status='approved';
  if(!d.bfLog)d.bfLog=[];
  d.bfLog.push({id:gid(),empId:r.empId,empName:r.empName,
    desc:r.desc,amt:r.amt,date:r.date,source:'task',approvedBy:'dir'});
  sd(d);
  rTasks();
  alert('Бонус одобрен! '+fm(r.amt)+' добавлено '+r.empName);
}

function rejectBonus(btn){
  var rid=parseInt(btn.dataset.rid);
  var d=od();
  if(!d.bonusRequests)return;
  var r=d.bonusRequests.find(function(x){return x.id===rid;});
  if(!r)return;
  r.status='rejected';
  // Unmark the task as done
  var tk=d.tasks.find(function(t){return t.id===r.taskId;});
  if(tk){tk.done=false;tk.doneTime=null;}
  sd(d);rTasks();
  alert('Бонус отклонён. Задача возвращена в статус "ожидает".');
}

function dirApproveBonuses(){
  var d=od();
  if(!d.bonusRequests)d.bonusRequests=[];
  var pending=d.bonusRequests.filter(function(r){return r.status==='pending';});
  var cnt=document.getElementById('bonus-cnt');
  if(cnt)cnt.textContent=pending.length?pending.length:'';
  var panel=document.getElementById('bonus-requests-panel');

  const d=od();const w=document.getElementById('w-analytics');
  ['an-d','an-pie','an-p','an-s'].forEach(dc);

  setTimeout(()=>{
    const byDay={};d.sales.forEach(s=>{byDay[s.date]=(byDay[s.date]||0)+s.total;});
    const days=Object.keys(byDay).sort().slice(-14);
    if(days.length)CH['an-d']=new Chart(document.getElementById('an-d'),{type:'bar',data:{labels:days.map(d=>d.slice(5)),datasets:[{data:days.map(d=>byDay[d]),backgroundColor:'#7C6FE0',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>Math.round(v/1000)+'k'},grid:{color:'rgba(0,0,0,0.05)'}},x:{grid:{display:false}}}}});
    const rev=d.sales.reduce((a,s)=>a+s.total,0);const cogs=d.sales.reduce((a,s)=>a+s.cogs,0);const taxAmt=rev*d.cfg.tax/100;const bk=d.sales.reduce((a,s)=>a+(s.commission||0),0);const salFix=d.employees.reduce((a,e)=>a+e.fix,0);const defL=d.defects.reduce((a,x)=>a+x.loss,0);const profit=Math.max(0,rev-cogs-taxAmt-bk-d.cfg.pen-d.cfg.rent-d.cfg.util-d.cfg.ads-salFix-defL);
    const pd=[cogs,taxAmt+d.cfg.pen,bk,salFix,d.cfg.rent,defL,profit];const pl=['Себестоимость','Налог+пенсия','Банк','Зарплаты','Аренда','Брак','Прибыль'];const pclr=['#E24B4A','#D85A30','#378ADD','#EF9F27','#BA7517','#F09595','#3CC88A'];
    const nz=pd.map((v,i)=>({v,l:pl[i],c:pclr[i]})).filter(x=>x.v>0);
    if(nz.length){CH['an-pie']=new Chart(document.getElementById('an-pie'),{type:'doughnut',data:{labels:nz.map(x=>x.l),datasets:[{data:nz.map(x=>x.v),backgroundColor:nz.map(x=>x.c),borderWidth:1,borderColor:'rgba(255,255,255,.4)'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});document.getElementById('pie-leg').innerHTML=nz.map(x=>`<span style="display:flex;align-items:center;gap:3px"><span style="width:9px;height:9px;border-radius:2px;background:${x.c}"></span>${x.l} ${pc(x.v,rev)}</span>`).join('');}
    const l30=d.sales.filter(s=>Date.now()-new Date(s.date).getTime()<30*864e5);const l60=d.sales.filter(s=>{const t2=Date.now()-new Date(s.date).getTime();return t2>=30*864e5&&t2<60*864e5;});const tM=l30.reduce((a,s)=>a+s.total,0);const lM=l60.reduce((a,s)=>a+s.total,0);const fc=Math.round(tM>0?tM*1.05:lM*1.05);
    document.getElementById('fc-info').innerHTML=`Прогноз на след. месяц: <b style="color:var(--pu)">${fm(fc)}</b>`;
    if(tM>0||lM>0)CH['an-fc']=new Chart(document.getElementById('an-fc'),{type:'bar',data:{labels:['Пр.мес.','Этот мес.','Прогноз'],datasets:[{data:[lM,tM,fc],backgroundColor:['#B5D4F4','#7C6FE0','#9FE1CB'],borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>Math.round(v/1000)+'k'},grid:{color:'rgba(0,0,0,0.05)'}},x:{grid:{display:false}}}}});

  },100);

function rBE(){const d=od();dc('ch-be');const fix=d.cfg.rent+d.cfg.util+d.cfg.ads+d.employees.reduce((a,e)=>a+e.fix,0)+d.cfg.pen;const avgP=d.sales.length?d.sales.reduce((a,s)=>a+s.price,0)/d.sales.length:0;const avgC=d.sales.length?d.sales.reduce((a,s)=>a+s.cogs/Math.max(s.qty,1),0)/d.sales.length:0;const w=document.getElementById('w-breakeven');w.innerHTML=`<div class="card"><div class="ct">Точка безубыточности</div><div class="row"><label>Постоянные расходы/мес</label><input class="inp" type="number" id="be-f" value="${Math.round(fix)||''}" placeholder="0" oninput="calcBE()"><span class="u">сум</span></div><div class="row"><label>Ср. цена продажи</label><input class="inp" type="number" id="be-p" value="${Math.round(avgP)||''}" placeholder="0" oninput="calcBE()"><span class="u">сум</span></div><div class="row"><label>Ср. себестоимость</label><input class="inp" type="number" id="be-c" value="${Math.round(avgC)||''}" placeholder="0" oninput="calcBE()"><span class="u">сум</span></div><div id="be-res"></div><div style="position:relative;height:200px;margin-top:12px"><canvas id="ch-be"></canvas></div></div>`;calcBE();}

--gr)',borderWidth:2.5,fill:false,pointRadius:0},{label:'Затраты',data:cl2,borderColor:'var(--re)',borderWidth:2.5,fill:false,pointRadius:0},{label:'Пост. расходы',data:fl,borderColor:'var(--ye)',borderWidth:2,fill:false,pointRadius:0,borderDash:[5,4]}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:12,font:{size:11}}}},scales:{y:{ticks:{callback:v=>Math.round(v/1000)+'k'},grid:{color:'rgba(0,0,0,0.05)'}},x:{grid:{display:false}}}}});}

  var sales=d.sales.filter(inPeriod);

  var comm=sales.reduce(function(a,s){return a+(s.commission||0);},0);
  var avgCheck=sales.length?rev/sales.length:0;
  var totalItems=sales.reduce(function(a,s){return a+s.qty;},0);

  // Period label

var _timerInterval = null;

function startTaskTimer(){
  stopTaskTimer();
  _timerInterval = setInterval(function(){
    var now = Date.now();
    document.querySelectorAll('.task-timer').forEach(function(el){
      var deadline = parseInt(el.dataset.deadline) || 0;
      if(!deadline) return;
      var ms = deadline - now;
      var late = ms < 0;
      var abs = Math.abs(ms);
      var h = Math.floor(abs / 3600000);
      var m = Math.floor((abs % 3600000) / 60000);
      var s = Math.floor((abs % 60000) / 1000);
      var str = (h > 0 ? h + 'ч ' : '') + (m > 0 ? m + 'м ' : '') + s + 'с';
      el.textContent = late ? ('🕐 Просрочено: ' + str) : ('⏱ Осталось: ' + str);
      el.style.color = late ? 'var(--re)' : (ms < 3600000 ? 'var(--ye2)' : 'var(--bl)');
    });
  }, 1000);
}

function stopTaskTimer(){
  if(_timerInterval){ clearInterval(_timerInterval); _timerInterval = null; }
}

      h+='<div class="row"><label>Заметка</label><input class="inp" id="cle-note-'+cl.id+'" value="'+(cl.note||'')+'" placeholder="Предпочтения..." style="background:#fff"></div>';
      h+='<div style="display:flex;gap:6px;margin-top:4px"><button class="btn btn-gr" data-cid="'+cl.id+'" onclick="clSaveEdit(this)" style="flex:1;font-size:12px">Сохранить</button><button class="btn" data-cid="'+cl.id+'" onclick="clToggleEdit(this)" style="font-size:12px">Отмена</button></div>';
      h+='</div></div>';
    });
  }
  h+='</div></div>';
  w.innerHTML=h;
}

function clToggleAdd(){var f=document.getElementById('add-client-form');if(f)f.style.display=f.style.display==='none'?'block':'none';}
function addClient(){
  var name=(document.getElementById('cl-name')?.value||'').trim();
  var phone=(document.getElementById('cl-phone')?.value||'').trim();
  if(!name&&!phone)return alert('Введите имя или телефон');
  var d=od();if(!d.clients)d.clients=[];
  if(phone&&d.clients.find(function(cl){return cl.phone===phone;}))return alert('Клиент с таким телефоном уже есть!');
  d.clients.push({id:gid(),name:name||'Клиент',phone:phone,note:document.getElementById('cl-note')?.value||'',visits:0,totalSpent:0,firstVisit:td(),lastVisit:td(),lastProduct:''});
  sd(d);
  ['cl-name','cl-phone','cl-note'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
  clToggleAdd();rClients();
}
function clToggleEdit(btn){var cid=btn.dataset.cid;var el=document.getElementById('cl-edit-'+cid);if(el)el.style.display=el.style.display==='none'?'block':'none';}
function clSaveEdit(btn){
  var cid=parseInt(btn.dataset.cid);var d=od();
  var cl=d.clients.find(function(x){return x.id===cid;});if(!cl)return;
  cl.name=(document.getElementById('cle-name-'+cid)?.value||cl.name).trim();
  cl.phone=(document.getElementById('cle-phone-'+cid)?.value||'').trim();
  cl.note=(document.getElementById('cle-note-'+cid)?.value||'').trim();
  sd(d);rClients();
}
function delClient(btn){if(!confirm('Удалить клиента?'))return;var cid=parseInt(btn.dataset.cid);var d=od();d.clients=d.clients.filter(function(x){return x.id!==cid;});sd(d);rClients();}
function clFilter(){
  var q=(document.getElementById('cl-search')?.value||'').toLowerCase();
  document.querySelectorAll('[id^="cl-card-"]').forEach(function(el){el.style.display=!q||el.textContent.toLowerCase().includes(q)?'':'none';});
}

// ===== CLIENT SEARCH FOR SALES =====
function clientSearch(inp, dropId){
  var q=(inp.value||'').trim().toLowerCase();
  var drop=document.getElementById(dropId);
  if(!drop)return;
  if(!q){drop.style.display='none';return;}
  var d=od();if(!d.clients)d.clients=[];
  var matches=d.clients.filter(function(cl){
    return cl.name.toLowerCase().includes(q)||
      (cl.phone&&cl.phone.replace(/[^0-9]/g,'').includes(q.replace(/[^0-9]/g,'')));
  }).slice(0,6);
  drop.style.display='block';
  if(!matches.length){
    var isNum=q.replace(/[^0-9]/g,'').length>=4;
    var newBtn=isNum?'<div onclick="newClientFromSale()" style="padding:8px 10px;cursor:pointer;font-size:12px;font-weight:800;color:var(--bl);border-top:1px solid var(--br)">+ Добавить нового клиента</div>':'';
    drop.innerHTML='<div style="padding:8px 10px;font-size:12px;color:var(--tx3);font-weight:700">Клиент не найден</div>'+newBtn;
    return;
  }
  var inpId=dropId.replace('-drop','');
  var rows='';
  matches.forEach(function(cl){
    rows+='<div data-inp="'+inpId+'" data-drop="'+dropId+'" data-cid="'+cl.id+'" onclick="clientSelectExisting(this)" style="padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--br);font-size:13px">';
    rows+='<div style="font-weight:800">'+cl.name+(cl.phone?' <span style="color:var(--tx3);font-size:11px">'+cl.phone+'</span>':'')+'</div>';
    rows+='<div style="font-size:11px;color:var(--tx2);font-weight:700">'+cl.visits+' покупок · '+fm(cl.totalSpent||0)+'</div>';
    rows+='</div>';
  });
  drop.innerHTML=rows;
}
function clientSearchEvt(inp){clientSearch(inp,inp.dataset.drop);}
function clientSelectExisting(el){
  var inpId=el.dataset.inp,dropId=el.dataset.drop,cid=parseInt(el.dataset.cid);
  var d=od();var cl=d.clients.find(function(x){return x.id===cid;});if(!cl)return;
  var inp=document.getElementById(inpId);if(inp)inp.value=cl.phone||cl.name;
  var drop=document.getElementById(dropId);if(drop)drop.style.display='none';
  showClientBadge(inpId,cl);
}
function showClientBadge(inpId,cl){
  var existing=document.getElementById(inpId+'-badge');if(existing)existing.remove();
  var inp=document.getElementById(inpId);if(!inp)return;
  var badge=document.createElement('div');
  badge.id=inpId+'-badge';
  badge.style.cssText='background:var(--bl3);border-radius:10px;padding:6px 10px;margin-top:4px;font-size:11px;font-weight:700;color:var(--bl2)';
  badge.innerHTML='👤 '+cl.name+(cl.phone?' · '+cl.phone:'')
    +' · '+cl.visits+' посещений · '+fm(cl.totalSpent||0)
    +(cl.note?' · 📝 '+cl.note:'');
  inp.parentNode.insertBefore(badge,inp.nextSibling);
}
function newClientFromSale(){goPage('clients');}
document.addEventListener('click',function(e){
  if(!e.target.closest('[id$="-drop"]')&&!e.target.matches('[data-drop]')){
    document.querySelectorAll('[id$="-drop"]').forEach(function(el){el.style.display='none';});
  }
});

// ===== INVESTMENTS =====
function rInvest(){
  var d=od();
  var w=document.getElementById('w-invest');if(!w)return;
  if(!d.investments)d.investments=[];
  if(!d.investMode)d.investMode='pre';
  var totalInvest=d.investments.reduce(function(a,x){return a+x.amt;},0);
  var totalRev=d.sales.reduce(function(a,s){return a+s.total;},0);
  var totalProfit=d.sales.reduce(function(a,s){return a+s.profit;},0);
  var salFix=d.employees.reduce(function(a,e){return a+(e.fix||0);},0);
  var fixedM=(d.cfg.rent||0)+(d.cfg.util||0)+(d.cfg.ads||0)+(d.cfg.pen||0)+salFix+(d.customExp||[]).reduce(function(a,e){return a+e.amt;},0);
  var firstDate=d.investments.length?d.investments.reduce(function(a,x){return x.date<a?x.date:a;},d.investments[0].date):td();
  var monthsOpen=Math.max(1,Math.ceil((Date.now()-new Date(firstDate).getTime())/(30*86400000)));
  var totalExpenses=fixedM*monthsOpen;
  var recovered=totalProfit-totalExpenses;
  var isPre=d.investMode==='pre';
  var recPct=totalInvest>0?Math.min(Math.max(0,recovered/totalInvest*100),100):0;
  var isRecovered=recovered>=totalInvest;
  var remaining=Math.max(0,totalInvest-Math.max(0,recovered));
  var h='';
  // Mode toggle
  h+='<div style="display:flex;gap:6px;margin-bottom:14px;background:var(--bg);border-radius:16px;padding:4px">';
  h+='<button data-mode="pre" onclick="setInvestMode(this.dataset.mode)" style="flex:1;padding:10px;border-radius:12px;border:none;font-size:13px;font-weight:900;cursor:pointer;background:'+(isPre?'var(--ye)':'transparent')+';color:'+(isPre?'#fff':'var(--tx2)')+'">🏗️ До открытия</button>';
  h+='<button data-mode="open" onclick="setInvestMode(this.dataset.mode)" style="flex:1;padding:10px;border-radius:12px;border:none;font-size:13px;font-weight:900;cursor:pointer;background:'+(!isPre?'var(--gr)':'transparent')+';color:'+(!isPre?'#fff':'var(--tx2)')+'">🚀 Открылись!</button>';
  h+='</div>';
  if(isPre){
    h+='<div style="background:linear-gradient(135deg,#F5A623,#E8544A);border-radius:20px;padding:16px;margin-bottom:14px;color:#fff">';
    h+='<div style="font-size:11px;opacity:.8;font-weight:700">Режим: До открытия</div>';
    h+='<div style="font-size:22px;font-weight:900">Вложено всего</div>';
    h+='<div style="font-size:32px;font-weight:900;margin:4px 0">'+fm(totalInvest)+'</div>';
    h+='<div style="font-size:12px;opacity:.8">'+d.investments.length+' статей вложений</div></div>';
    // Add form
    h+='<div class="card" style="border:2px solid var(--ye)"><div class="ct" style="color:var(--ye2)">+ Добавить вложение</div>';
    h+='<div class="row"><label>Категория</label><select class="inp" id="inv-cat"><option>Аренда помещения</option><option>Ремонт / отделка</option><option>Мебель</option><option>Оборудование</option><option>Товар (первая закупка)</option><option>Реклама / вывеска</option><option>Документы / регистрация</option><option>Зарплата до открытия</option><option>Коммунальные до открытия</option><option>Прочее</option></select></div>';
    h+='<div class="row"><label>Название</label><input class="inp" id="inv-name" placeholder="Например: Диван, стол, вывеска..."></div>';
    h+='<div class="row"><label>Сумма</label><input class="inp" type="number" id="inv-amt" placeholder="0"><span class="u">сум</span></div>';
    h+='<div class="row"><label>Дата</label><input class="inp" type="date" id="inv-date" value="'+td()+'"></div>';
    h+='<div class="row"><label>Заметка</label><input class="inp" id="inv-note" placeholder="Комментарий..."></div>';
    h+='<button class="btn btn-ye" onclick="addInvestment()" style="width:100%;margin-top:6px;padding:12px;font-size:14px">+ Добавить вложение</button></div>';
    // Category chart
    if(d.investments.length){
      var byCat={};
      d.investments.forEach(function(x){byCat[x.cat]=(byCat[x.cat]||0)+x.amt;});
      var catKeys=Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a];});
      var maxCat=byCat[catKeys[0]]||1;
      h+='<div class="card"><div class="ct">По категориям</div>';
      catKeys.forEach(function(cat){
        var pct=Math.round(byCat[cat]/maxCat*100);
        var sh=Math.round(byCat[cat]/totalInvest*100);
        h+='<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:13px;font-weight:800">'+cat+'</span><span style="font-size:13px;font-weight:900;color:var(--ye2)">'+fm(byCat[cat])+' ('+sh+'%)</span></div>';
        h+='<div style="background:var(--bg);border-radius:6px;height:8px;overflow:hidden"><div style="height:100%;border-radius:6px;background:var(--ye);width:'+pct+'%"></div></div></div>';
      });
      h+='<div style="display:flex;justify-content:space-between;padding:10px 0;border-top:2px solid var(--br);margin-top:4px"><span style="font-size:14px;font-weight:900">Итого вложено</span><span style="font-size:16px;font-weight:900;color:var(--ye2)">'+fm(totalInvest)+'</span></div></div>';
      h+='<div class="card"><div class="ct">Все вложения</div>';
      d.investments.slice().sort(function(a,b){return b.date>a.date?1:-1;}).forEach(function(x){
        h+='<div class="li"><div style="flex:1"><div style="font-weight:800">'+x.name+'</div><div style="font-size:11px;color:var(--tx3);font-weight:700">'+x.cat+' · '+x.date+(x.note?' · '+x.note:'')+'</div></div><div style="display:flex;align-items:center;gap:8px"><span style="font-weight:900;color:var(--ye2)">'+fm(x.amt)+'</span><button class="del" data-iid="'+x.id+'" onclick="delInvestment(this)">×</button></div></div>';
      });
      h+='</div>';
    }
    h+='<div style="text-align:center;margin-top:14px"><button data-mode="open" onclick="setInvestMode(this.dataset.mode)" class="btn btn-gr" style="padding:14px 28px;font-size:15px">🚀 Открылись! Перейти в режим окупаемости</button></div>';
  } else {
    // OPEN MODE
    h+='<div style="background:linear-gradient(135deg,'+(isRecovered?'var(--gr2),#3CC88A':'var(--pu2),var(--pu)')+');border-radius:20px;padding:16px;margin-bottom:14px;color:#fff">';
    h+='<div style="font-size:11px;opacity:.8;font-weight:700">'+(isRecovered?'✅ ВЛОЖЕНИЯ ОКУПИЛИСЬ!':'📈 Режим: Окупаемость')+'</div>';
    h+='<div style="font-size:22px;font-weight:900;margin-top:4px">'+(isRecovered?'Бизнес в плюсе!':'Идём к окупаемости...')+'</div>';
    h+='<div style="font-size:36px;font-weight:900;margin:4px 0">'+recPct.toFixed(0)+'%</div>';
    h+='<div style="font-size:13px;opacity:.8">'+(isRecovered?'Прибыль сверх вложений: '+fm(recovered-totalInvest):'Осталось: '+fm(remaining))+'</div></div>';
    // Progress
    h+='<div style="background:var(--bg);border-radius:12px;height:22px;overflow:hidden;margin-bottom:14px;position:relative">';
    h+='<div style="height:100%;border-radius:12px;background:'+(isRecovered?'var(--gr)':'linear-gradient(90deg,var(--pu),var(--bl))')+';width:'+recPct.toFixed(1)+'%;transition:width 1s"></div>';
    h+='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:'+(recPct>40?'#fff':'var(--tx)')+'">'+recPct.toFixed(1)+'% окупаемости</div></div>';
    // Stats
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">';
    [{l:'Вложено всего',v:fm(totalInvest),bg:'var(--ye3)',cl:'var(--ye2)'},
     {l:'Прибыль накоплена',v:fm(Math.max(0,recovered)),bg:'var(--gr3)',cl:'var(--gr2)'},
     {l:'Выручка всего',v:fm(totalRev),bg:'var(--bl3)',cl:'var(--bl2)'},
     {l:isRecovered?'Окупился':'Осталось окупить',v:isRecovered?'✅':fm(remaining),bg:isRecovered?'var(--gr3)':'var(--re3)',cl:isRecovered?'var(--gr2)':'var(--re2)'}
    ].forEach(function(s){
      h+='<div style="background:'+s.bg+';border-radius:16px;padding:12px"><div style="font-size:11px;font-weight:800;color:'+s.cl+'">'+s.l+'</div><div style="font-size:17px;font-weight:900;color:'+s.cl+';margin-top:3px">'+s.v+'</div></div>';
    });
    h+='</div>';
    // Forecast
    if(!isRecovered&&totalRev>0){
      var avgMP=totalProfit/Math.max(monthsOpen,1);
      var mToGo=avgMP>0?Math.ceil(remaining/avgMP):999;
      h+='<div class="card" style="background:var(--pu3);border:2px solid var(--pu);margin-bottom:12px"><div style="font-size:13px;font-weight:900;color:var(--pu2);margin-bottom:8px">📅 Прогноз окупаемости</div>';
      h+='<div style="font-size:13px;font-weight:700;color:var(--tx2)">Ср. прибыль/мес: <b style="color:var(--pu)">'+fm(Math.round(avgMP))+'</b></div>';
      h+='<div style="font-size:13px;font-weight:700;color:var(--tx2);margin-top:4px">Работаем: <b>'+monthsOpen+' мес</b></div>';
      h+='<div style="margin-top:10px;background:var(--pu);border-radius:14px;padding:12px;text-align:center"><div style="font-size:12px;font-weight:800;color:rgba(255,255,255,.8)">Ожидаемая окупаемость</div><div style="font-size:24px;font-weight:900;color:#fff;margin-top:4px">≈ '+mToGo+' мес.</div></div></div>';
    }
    if(d.investments.length){
      h+='<div class="card"><div class="ct">Исходные вложения</div>';
      d.investments.slice(0,5).forEach(function(x){h+='<div class="li"><div style="flex:1"><div style="font-weight:700">'+x.name+'</div><div style="font-size:11px;color:var(--tx3)">'+x.cat+' · '+x.date+'</div></div><span style="font-weight:900;color:var(--ye2)">'+fm(x.amt)+'</span></div>';});
      if(d.investments.length>5)h+='<div style="text-align:center;font-size:12px;color:var(--tx3);padding:6px">+'+( d.investments.length-5)+' ещё...</div>';
      h+='</div>';
    }
    h+='<div style="text-align:center;margin-top:10px"><button data-mode="pre" onclick="setInvestMode(this.dataset.mode)" class="btn" style="font-size:12px">← К списку вложений</button></div>';
  }
  w.innerHTML=h;
}

function setInvestMode(mode){var d=od();d.investMode=mode;sd(d);rInvest();}
function addInvestment(){
  var d=od();if(!d.investments)d.investments=[];
  var name=(document.getElementById('inv-name')?.value||'').trim();
  var amt=parseFloat(document.getElementById('inv-amt')?.value)||0;
  if(!name||!amt)return alert('Введите название и сумму');
  d.investments.push({id:gid(),cat:document.getElementById('inv-cat')?.value||'Прочее',name:name,amt:amt,date:document.getElementById('inv-date')?.value||td(),note:document.getElementById('inv-note')?.value||''});
  sd(d);rInvest();
}
function delInvestment(btn){if(!confirm('Удалить?'))return;var id=parseInt(btn.dataset.iid);var d=od();d.investments=d.investments.filter(function(x){return x.id!==id;});sd(d);rInvest();}
